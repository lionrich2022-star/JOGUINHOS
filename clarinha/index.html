<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aprenda com a Clarinha</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  /* layout: coluna única — Clarinha no topo, balão de fala, atividade, rodapé */
  --bg:#fdf4ff;
  --panel:#ffffff;
  --line:#ecd5f5;
  --text:#3b2252;
  --muted:#8a6ba6;
  --accent:#d946ef;
  --accent-soft:#fae8ff;
  --good:#16a34a;
  --bad:#e11d48;
  --star:#f59e0b;
  --shadow:0 10px 30px rgba(59,34,82,.14);
  --font-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,sans-serif;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#1a1030; --panel:#2a1b4a; --line:#3d2a66; --text:#f5edff; --muted:#b9a3dd;
    --accent:#e879f9; --accent-soft:#3b1d55; --good:#4ade80; --bad:#fb7185;
    --star:#fbbf24; --shadow:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1030; --panel:#2a1b4a; --line:#3d2a66; --text:#f5edff; --muted:#b9a3dd;
  --accent:#e879f9; --accent-soft:#3b1d55; --good:#4ade80; --bad:#fb7185;
  --star:#fbbf24; --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--font-body);
  display:flex;flex-direction:column;align-items:center;
  padding:14px;gap:10px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  transition:background .3s,color .3s;
}
header{width:min(94vw,480px);display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{
  font-family:var(--font-display);font-size:clamp(1.25rem,5vw,1.6rem);text-wrap:balance;
  background:linear-gradient(90deg,#e879f9,#fb7185,#fbbf24,#4ade80);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.icon-btn{
  width:42px;height:42px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
}
.icon-btn svg{width:20px;height:20px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hbtns{display:flex;gap:8px}

.clarinha-wrap{display:flex;align-items:flex-end;gap:6px;width:min(94vw,480px);justify-content:center}
#clarinha{width:clamp(110px,30vw,150px);flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.2))}
#clarinha.happy{animation:jump .6s}
@keyframes jump{30%{transform:translateY(-14px) rotate(-3deg)}60%{transform:translateY(0)}80%{transform:translateY(-6px)}}
.bubble{
  position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);
  font-weight:800;font-size:clamp(.9rem,3.5vw,1.05rem);max-width:270px;
}
.bubble::before{
  content:"";position:absolute;left:-8px;bottom:18px;
  border:8px solid transparent;border-right-color:var(--panel);
}
.screen{width:min(94vw,480px);display:flex;flex-direction:column;gap:10px;align-items:stretch}
.screen.hidden{display:none}
.menu-btn{
  display:flex;align-items:center;gap:12px;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);color:var(--text);
  transition:transform .12s;
}
.menu-btn:active{transform:scale(.97)}
.menu-btn .mi{font-size:2rem;flex:none}
.menu-btn .mt{font-family:var(--font-display);font-weight:800;font-size:1.1rem}
.menu-btn .ms{color:var(--muted);font-size:.82rem;font-weight:700}
.menu-btn .rec{margin-left:auto;color:var(--star);font-weight:800;font-size:.85rem;white-space:nowrap}

.hud{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--muted)}
.hud .stars{color:var(--star);font-size:1.05rem}
.qcard{
  background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;align-items:center;
}
.qtext{font-family:var(--font-display);font-weight:800;font-size:clamp(1.05rem,4.5vw,1.3rem);text-align:center;text-wrap:balance}
.qvisual{
  min-height:84px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;
  font-size:clamp(1.9rem,8vw,2.6rem);text-align:center;line-height:1.25;max-width:100%;
}
.swatch{width:92px;height:92px;border-radius:26px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.15),var(--shadow)}
.speak-btn{
  border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);
  border-radius:999px;padding:7px 16px;font-weight:800;font-family:var(--font-body);
  cursor:pointer;font-size:.85rem;
}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{
  background:var(--panel);border:2px solid var(--line);border-radius:18px;
  padding:16px 6px;cursor:pointer;box-shadow:var(--shadow);color:var(--text);
  font-family:var(--font-display);font-weight:800;font-size:clamp(1.3rem,6vw,1.7rem);
  transition:transform .12s;
}
.opt:active{transform:scale(.94)}
.opt .dot{display:block;width:46px;height:46px;border-radius:14px;margin:0 auto;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 0 0 2px rgba(255,255,255,.55)}
.opt.ok{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.back-link{align-self:center;background:none;border:none;color:var(--muted);font-weight:800;cursor:pointer;font-family:var(--font-body);font-size:.85rem;padding:6px}

.end-card{
  background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:22px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;
}
.end-card .big{font-family:var(--font-display);font-weight:800;font-size:1.5rem}
.end-card .stars-big{font-size:1.8rem;letter-spacing:2px;color:var(--star)}
#endRecord{
  display:none;background:var(--accent-soft);color:var(--accent);
  border:1px solid var(--accent);border-radius:999px;padding:4px 14px;font-weight:800;font-size:.85rem;
}
.big-btn{
  border:none;cursor:pointer;background:linear-gradient(135deg,#e879f9,#d946ef);
  color:#fff;font-family:var(--font-display);font-weight:800;font-size:1.05rem;
  padding:12px 30px;border-radius:999px;box-shadow:0 8px 20px rgba(217,70,239,.4);
  transition:transform .12s;
}
.big-btn:active{transform:scale(.95)}
.big-btn.alt{background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow)}
footer{margin-top:auto;padding-top:6px;color:var(--muted);font-size:.72rem;font-weight:600;letter-spacing:.03em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* nome do jogador e ranking */
.nm-wrap{display:flex;flex-direction:column;gap:4px;align-items:center}
.nm-label{font-size:.78rem;font-weight:800;color:var(--muted)}
.nm-input{width:min(230px,72vw);text-align:center;font:inherit;font-weight:800;font-size:1rem;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text)}
.nm-input:focus{outline:none;border-color:var(--accent)}
.nm-row{display:flex;gap:8px;align-items:center;justify-content:center;width:min(94vw,var(--rkw,440px))}
.nm-row .nm-input{flex:1;max-width:260px;text-align:left}
.nm-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.rk-card{width:min(94vw,var(--rkw,440px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.screen .rk-card{width:100%}
.rk-title{font-family:var(--font-display);font-weight:800;font-size:1.05rem}
.rk-row{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.92rem;padding:4px 8px;border-radius:10px}
.rk-row.me{background:var(--accent-soft)}
.rk-pos{width:2rem;text-align:center;flex:none}
.rk-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-score{color:var(--accent);font-variant-numeric:tabular-nums;flex:none}
.rk-empty{color:var(--muted);font-weight:700;font-size:.85rem}
.rk-line{font-weight:800;color:var(--accent);text-align:center;text-wrap:balance;min-height:1.2em}
#overOverlay .emoji,#winOverlay .emoji{font-size:2.1rem}
#overOverlay,#winOverlay{gap:7px}
.overlay{overflow-y:auto;justify-content:safe center}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1030">
<meta name="mobile-web-app-capable" content="yes">

<style>
#installWrap button{background:none;border:none;color:var(--accent);font:inherit;font-weight:800;
  cursor:pointer;text-decoration:underline;padding:0}
#installWrap button:disabled{cursor:default;text-decoration:none;color:var(--muted)}
</style>

<body>

<header>
  <h1>Aprenda com a Clarinha</h1>
  <div class="hbtns">
  <button class="icon-btn" id="voiceBtn" aria-label="Trocar voz da Clarinha" title="Trocar voz da Clarinha"><span style="font-size:1.15rem;line-height:1">🎙️</span></button>
  <button class="icon-btn" id="themeBtn" aria-label="Trocar tema" title="Trocar tema">

  </button>

    </g>
    <!-- orelhas -->

    <circle cx="50" cy="112" r="2.6" fill="#f3c33c"/><circle cx="150" cy="112" r="2.6" fill="#f3c33c"/>
    <!-- rosto -->

    <!-- franja -->

      <circle cx="68" cy="70" r="17"/><circle cx="92" cy="62" r="18"/>
      <circle cx="116" cy="64" r="17"/><circle cx="136" cy="74" r="15"/>
      <circle cx="56" cy="84" r="13"/><circle cx="146" cy="88" r="12"/>

      <ellipse cx="80" cy="104" rx="11" ry="13" fill="#fff"/>

<!-- MENU -->
<div class="screen" id="menuScreen">
  <div class="nm-wrap nm-card"><label class="nm-label" for="nameMenu">Quem vai brincar?</label><input class="nm-input" id="nameMenu" maxlength="12" placeholder="Escreva seu nome" autocomplete="off"></div>
  <button class="menu-btn" data-game="contar">
    <span class="mi">🔢</span>
    <span><span class="mt">Contar</span><br><span class="ms">Quantos tem aí?</span></span>
    <span class="rec" id="recContar"></span>
  </button>
  <button class="menu-btn" data-game="letras">
    <span class="mi">🔤</span>
    <span><span class="mt">Letrinhas</span><br><span class="ms">Com que letra começa?</span></span>
    <span class="rec" id="recLetras"></span>
  </button>
  <button class="menu-btn" data-game="cores">
    <span class="mi">🎨</span>
    <span><span class="mt">Cores</span><br><span class="ms">Que cor é esta?</span></span>
    <span class="rec" id="recCores"></span>
  </button>
  <button class="menu-btn" data-game="ingles">
    <span class="mi">🗣️</span>
    <span><span class="mt">Inglês</span><br><span class="ms">Palavrinhas em inglês</span></span>
    <span class="rec" id="recIngles"></span>

<footer>Criado por Wesley de Jesus<span id="installWrap" hidden> · <button id="installBtn" type="button">📲 Instalar no aparelho</button></span></footer>

<script>
(function(){
  "use strict";
  /* ===== Jogador e ranking (fica salvo neste aparelho) ===== */
  var NAME_KEY = "joguinhos-jogador";
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function cleanName(n){ return String(n==null?"":n).replace(/\s+/g," ").trim().slice(0,12); }

  function makeRanking(cfg){
    var key = cfg.key, low = !!cfg.low;
    function storeKey(){ return "joguinhos-rank-"+key; }
    function readList(){
      try{ var a = JSON.parse(lsGet(storeKey())||"[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; }
    }
    function cmp(x,y){
      return low ? (x.s-y.s)||((x.t||0)-(y.t||0)) : (y.s-x.s)||((x.d||0)-(y.d||0));
    }
    function nameNow(){ return cleanName(lsGet(NAME_KEY)) || "Jogador"; }
    function rowsAll(){ return cfg.rows ? cfg.rows() : readList().sort(cmp); }
    function render(){
      var box = document.getElementById("rkList"); if(!box) return;
      var rows = rowsAll().slice(0,5), me = nameNow().toLowerCase();
      box.textContent = "";
      if(!rows.length){
        var e = document.createElement("div"); e.className = "rk-empty";
        e.textContent = "Ninguém no ranking ainda. Seja o primeiro!"; box.appendChild(e); return;
      }
      var medals = ["🥇","🥈","🥉"];
      rows.forEach(function(r,i){
        var d = document.createElement("div");
        d.className = "rk-row" + (String(r.n).toLowerCase()===me ? " me" : "");
        var a = document.createElement("span"); a.className = "rk-pos"; a.textContent = medals[i] || (i+1)+"º";
        var b = document.createElement("span"); b.className = "rk-name"; b.textContent = r.n;
        var c = document.createElement("span"); c.className = "rk-score"; c.textContent = cfg.fmt ? cfg.fmt(r) : r.s;
        d.appendChild(a); d.appendChild(b); d.appendChild(c); box.appendChild(d);
      });
    }
    // registra a pontuação (guarda só a melhor de cada jogador) e devolve a posição
    function submit(score, extra){
      if(!(score>0)) return null;
      var name = nameNow(), id = name.toLowerCase(), a = readList(), found = -1;
      for(var i=0;i<a.length;i++){ if(String(a[i].n).toLowerCase()===id){ found = i; break; } }
      var entry = {n:name, s:score, t:extra||0, d:Date.now()};
      if(found>=0){ if(cmp(entry,a[found])<0) a[found] = entry; } else { a.push(entry); }
      a.sort(cmp); a = a.slice(0,50);
      lsSet(storeKey(), JSON.stringify(a));
      var rows = rowsAll(), pos = 0;
      for(var j=0;j<rows.length;j++){ if(String(rows[j].n).toLowerCase()===id){ pos = j+1; break; } }
      render();
      return {name:name, pos:pos};
    }
    function line(res){
      if(!res || !res.pos) return "";
      return res.pos===1 ? "🥇 "+res.name+" está em 1º lugar no ranking!" : "🏅 "+res.name+" está em "+res.pos+"º lugar no ranking";
    }
    function init(){
      var inputs = document.querySelectorAll(".nm-input"), saved = cleanName(lsGet(NAME_KEY));
      Array.prototype.forEach.call(inputs,function(inp){
        inp.value = saved;
        inp.addEventListener("input",function(){
          lsSet(NAME_KEY, cleanName(inp.value));
          Array.prototype.forEach.call(inputs,function(o){ if(o!==inp) o.value = inp.value; });
          render();
        });
      });
      render();
    }
    return {init:init, render:render, submit:submit, line:line, name:nameNow,
            setKey:function(k){ key = k; render(); }};
  }

  var RK = makeRanking({key:"clarinha-contar", fmt:function(r){ return r.s+" ⭐"; }, rows:function(){
      var acts=["contar","letras","cores","ingles","coresen"], tot={};
      acts.forEach(function(k){
        try{ JSON.parse(lsGet("joguinhos-rank-clarinha-"+k)||"[]").forEach(function(e){
          var id=String(e.n).toLowerCase(); if(!tot[id]) tot[id]={n:e.n,s:0,d:e.d||0}; tot[id].s+=e.s; });
        }catch(x){}
      });
      return Object.keys(tot).map(function(i){ return tot[i]; }).sort(function(a,b){ return (b.s-a.s)||(a.d-b.d); });
    }});
  var TOTAL = 10;

  var WORDS = [
    {w:"GATO",e:"🐱"},{w:"BOLA",e:"⚽"},{w:"CASA",e:"🏠"},{w:"PATO",e:"🦆"},
    {w:"UVA",e:"🍇"},{w:"SOL",e:"☀️"},{w:"LUA",e:"🌙"},{w:"PEIXE",e:"🐟"},
    {w:"FLOR",e:"🌸"},{w:"DADO",e:"🎲"},{w:"MACACO",e:"🐵"},{w:"ABELHA",e:"🐝"},
    {w:"ELEFANTE",e:"🐘"},{w:"IGREJA",e:"⛪"},{w:"NAVIO",e:"🚢"},{w:"RATO",e:"🐭"},
    {w:"SAPO",e:"🐸"},{w:"TATU",e:"🦔"},{w:"VACA",e:"🐮"},{w:"JACARÉ",e:"🐊"}
  ];
  var COUNT_EMOJIS = ["🍎","⭐","🐤","🌼","🍓","🎈","🐢","🍪","🚗","🦋"];
  var COLORS = [
    {n:"Vermelho",en:"Red",h:"#e11d48"},{n:"Azul",en:"Blue",h:"#2563eb"},{n:"Amarelo",en:"Yellow",h:"#facc15"},
    {n:"Verde",en:"Green",h:"#16a34a"},{n:"Roxo",en:"Purple",h:"#7c3aed"},{n:"Laranja",en:"Orange",h:"#f97316"},
    {n:"Rosa",en:"Pink",h:"#f472b6"},{n:"Marrom",en:"Brown",h:"#92400e"}
  ];
  var PRAISE = ["Muito bem! 🎉","Isso aí! ⭐","Você é demais! 💜","Acertou! 👏","Uhuul! 🌈"];
  var TRY_AGAIN = ["Quase! Tente de novo 😊","Hmm, tenta outra! 💪","Você consegue! 🍀"];
  var LETTERS = "ABCDEFGIJLMNOPRSTUV".split("");
  var EN_WORDS = [
    {en:"Cat",pt:"Gato",e:"🐱"},{en:"Dog",pt:"Cachorro",e:"🐶"},{en:"Apple",pt:"Maçã",e:"🍎"},
    {en:"Banana",pt:"Banana",e:"🍌"},{en:"Sun",pt:"Sol",e:"☀️"},{en:"Moon",pt:"Lua",e:"🌙"},
    {en:"House",pt:"Casa",e:"🏠"},{en:"Car",pt:"Carro",e:"🚗"},{en:"Ball",pt:"Bola",e:"⚽"},
    {en:"Fish",pt:"Peixe",e:"🐟"},{en:"Bird",pt:"Pássaro",e:"🐦"},{en:"Flower",pt:"Flor",e:"🌸"},
    {en:"Book",pt:"Livro",e:"📖"},{en:"Milk",pt:"Leite",e:"🥛"},{en:"Star",pt:"Estrela",e:"⭐"},
    {en:"Tree",pt:"Árvore",e:"🌳"},{en:"Heart",pt:"Coração",e:"❤️"},{en:"Bread",pt:"Pão",e:"🍞"},
    {en:"Rain",pt:"Chuva",e:"🌧️"},{en:"Cake",pt:"Bolo",e:"🎂"}
  ];

  var el = function(id){ return document.getElementById(id); };
  var bubble = el("bubble"), clar = el("clarinha"), mouth = el("mouth");
  var armsUp = el("armsUp"), armsDown = el("armsDown");

  function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

  /* tema */
  var savedTheme = store("clarinha-theme");
  if(savedTheme==="light"||savedTheme==="dark"){ document.documentElement.setAttribute("data-theme",savedTheme); }
  function syncThemeIcon(){
    var dark = document.documentElement.getAttribute("data-theme")!=="light";
    el("iconSun").style.display = dark?"":"none";
    el("iconMoon").style.display = dark?"none":"";
  }
  syncThemeIcon();
  el("themeBtn").addEventListener("click",function(){
    var next = document.documentElement.getAttribute("data-theme")!=="light" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme",next);
    store("clarinha-theme",next); syncThemeIcon();
  });

  var chosenVoice = null, chosenVoiceEn = null;
  var FEM_NAMES = ["francisca","luciana","camila","vitoria","vitória","maria","leticia","letícia","fernanda","thalita","yara",
                   "helena","ines","inês","joana","raquel","heloisa","samantha","zira","aria","jenny","susan","karen",
                   "victoria","allison","ava","emma","libby","sonia","female","feminin","mulher"];
  var MALE_RE = /\b(male|david|mark|daniel|james|george|ricardo|antonio|antónio|felipe|duarte|paulo|jorge|guy|ryan|eric|christopher|brian|roger|thomas|alex)\b/;
  function isFemaleName(n){
    n=(n||"").toLowerCase();
    if(MALE_RE.test(n)) return false;
    for(var j=0;j<FEM_NAMES.length;j++){ if(n.indexOf(FEM_NAMES[j])>=0) return true; }
    return false;
  }
  function langList(prefix){
    var voices = (window.speechSynthesis && window.speechSynthesis.getVoices()) || [];
    return voices.filter(function(v){ return v.lang && v.lang.toLowerCase().replace("_","-").indexOf(prefix)===0; });
  }
  function bestVoice(prefix, exactLang, savedKey){
    var list = langList(prefix);
    var saved = store(savedKey);
    if(saved){ for(var k=0;k<list.length;k++){ if(list[k].name===saved) return list[k]; } }
    var best=null, bestScore=-100;
    for(var i=0;i<list.length;i++){
      var n=(list[i].name||"").toLowerCase(), sc=0;
      if(n.indexOf("natural")>=0) sc+=4;            // vozes neurais (mais naturais)
      if(n.indexOf("google")>=0) sc+=3;             // voz do Google costuma ser feminina
      if((list[i].lang||"").toLowerCase().replace("_","-")===exactLang) sc+=2;
      if(isFemaleName(n)) sc+=6;
      if(MALE_RE.test(n)) sc-=8;
      if(sc>bestScore){ bestScore=sc; best=list[i]; }
    }
    return best;
  }
  function pickVoice(){
    try{
      if(!window.speechSynthesis) return;
      chosenVoice = bestVoice("pt","pt-br","clarinha-voice-pt");
      chosenVoiceEn = bestVoice("en","en-us","clarinha-voice-en");
    }catch(e){}
  }
  pickVoice();
  try{ if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}

  function speak(text, lang){
    try{
      if(!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      pickVoice();
      var en = lang==="en-US";
      var u = new SpeechSynthesisUtterance(text);
      u.lang = en ? "en-US" : "pt-BR";
      u.rate = en ? 0.8 : 0.95;                 // inglês um pouco mais devagar para a criança ouvir bem
      var v = en ? chosenVoiceEn : chosenVoice;
      if(v) u.voice = v;
      // voz que não é reconhecidamente feminina fica mais aguda, com timbre de menina
      u.pitch = (v && isFemaleName(v.name)) ? 1.1 : 1.45;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  // botão 🎙️: troca a voz (inglês quando está na atividade de Inglês, senão português)
  function cycleVoice(){
    try{
      var inEn = ((game==="ingles"||game==="coresen") && !el("gameScreen").classList.contains("hidden"));
      var list = langList(inEn ? "en" : "pt");
      if(!list.length){
        say("Este aparelho não tem outras vozes. Dá para baixar mais nas configurações de voz do celular.");
        return;
      }
      var cur = inEn ? chosenVoiceEn : chosenVoice;
      var idx = list.indexOf(cur);
      var nxt = list[(idx+1)%list.length];
      store(inEn ? "clarinha-voice-en" : "clarinha-voice-pt", nxt.name);
      speak(inEn ? "Hello! I am Clarinha!" : "Oi! Eu sou a Clarinha!", inEn ? "en-US" : "pt-BR");
      var shown = nxt.name.replace(/^Microsoft\s+/,"").replace(/\s*-\s*.*$/,"");
      say("🎙️ Voz "+((list.indexOf(nxt))+1)+" de "+list.length+": "+shown+". Toque de novo para trocar.");
    }catch(e){}
  }

  /* sons (gerados no próprio navegador, sem arquivos) */
  var audioCtx = null;
  function ac(){
    try{
      if(!audioCtx){ var C = window.AudioContext||window.webkitAudioContext; if(C) audioCtx = new C(); }
      if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
    }catch(e){}
    return audioCtx;
  }
  function tone(freq,start,dur,type,vol){
    try{
      var ctx = audioCtx; if(!ctx) return;
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type||"triangle"; o.frequency.value = freq;
      var t = ctx.currentTime+start;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol||0.22,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t+dur+0.05);
    }catch(e){}
  }
  function playCorrect(){ if(!ac())return; tone(523.25,0,.15); tone(659.25,.12,.15); tone(783.99,.24,.18); tone(1046.5,.38,.3,"triangle",.28); }
  function playWrong(){ if(!ac())return; tone(220,0,.2,"sawtooth",.1); tone(164.81,.18,.32,"sawtooth",.1); }
  function playWin(){
    if(!ac())return;
    var seq=[523.25,659.25,783.99,1046.5,783.99,1046.5];
    for(var i=0;i<seq.length;i++) tone(seq[i], i*.14, .18, "triangle", .26);
    tone(1318.5,.84,.5,"triangle",.28);
  }

  function celebrate(){
    armsUp.style.display=""; armsDown.style.display="none";
    mouth.setAttribute("d","M86 130 q14 16 28 0");
    clar.classList.remove("happy"); void clar.offsetWidth; clar.classList.add("happy");
    setTimeout(function(){
      armsUp.style.display="none"; armsDown.style.display="";
      mouth.setAttribute("d","M88 132 q12 10 24 0");
    },1200);
  }

  function say(msg){ bubble.textContent = msg; }
  function rand(n){ return Math.floor(Math.random()*n); }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=rand(i+1);var t=a[i];a[i]=a[j];a[j]=t;} return a; }
  function pickOthers(pool, correct, n){
    var out=[], used={}; used[correct]=1;
    while(out.length<n){
      var c = pool[rand(pool.length)];
      if(!used[c]){ used[c]=1; out.push(c); }
    }
    return out;
  }

  /* recordes no menu */
  function refreshRecords(){
    var map = {contar:"recContar",letras:"recLetras",cores:"recCores",ingles:"recIngles",coresen:"recCoresEn"};
    for(var g in map){
      var r = store("clarinha-best-"+g);
      el(map[g]).textContent = r ? "⭐ "+r+"/10" : "";
    }
  }

  var game=null, qIndex=0, stars=0, mistakes=false, current=null, answering=true;

  function makeQuestion(){
    mistakes = false; answering = true;
    var q = {};
    if(game==="contar"){
      var n = 1+rand(9);
      var em = COUNT_EMOJIS[rand(COUNT_EMOJIS.length)];
      q.text = "Quantos tem aqui?";
      q.speak = "Quantos tem aqui? Conte comigo!";
      q.visual = Array(n+1).join(em+" ").trim();
      q.answer = String(n);
      var nums=[]; for(var i=1;i<=10;i++) if(i!==n) nums.push(String(i));
      q.options = shuffle([q.answer].concat(pickOthers(nums,q.answer,2)));
    } else if(game==="letras"){
      var w = WORDS[rand(WORDS.length)];
      q.text = "Com que letra começa "+w.w+"?";
      q.speak = "Com que letra começa a palavra "+w.w.toLowerCase()+"?";
      q.visual = w.e+" "+w.w;
      q.answer = w.w[0];
      q.options = shuffle([q.answer].concat(pickOthers(LETTERS,q.answer,2)));
    } else if(game==="ingles"){
      var ew = EN_WORDS[rand(EN_WORDS.length)];
      q.word = ew;
      if(Math.random()<0.5){
        // figura -> escolher a palavra em inglês
        q.text = "Como se diz em inglês?";
        q.speak = "Como se diz "+ew.pt.toLowerCase()+" em inglês?";
        q.speakLang = "pt-BR";
        q.speakLabel = "🔊 Ouvir a pergunta";
        q.visual = ew.e;
        q.answer = ew.en;
        var enNames = EN_WORDS.map(function(x){return x.en;});
        q.options = shuffle([ew.en].concat(pickOthers(enNames,ew.en,2)));
        q.optLang = "en-US";   // ao tocar numa opção, a Clarinha fala a palavra em inglês
      } else {
        // palavra em inglês -> escolher a figura
        q.text = "O que significa "+ew.en+"?";
        q.speak = ew.en;
        q.speakLang = "en-US";
        q.speakLabel = "🔊 Ouvir a palavra";
        q.visual = ew.en;
        q.answer = ew.e;
        var emojis = EN_WORDS.map(function(x){return x.e;});
        q.options = shuffle([ew.e].concat(pickOthers(emojis,ew.e,2)));
        q.autoSpeak = true;
      }
    } else if(game==="coresen"){
      var cc = COLORS[rand(COLORS.length)];
      q.word = {en:cc.en, pt:cc.n, e:"🎨"};
      if(Math.random()<0.5){
        // cor -> escolher o nome em inglês
        q.text = "Qual é esta cor em inglês?";
        q.speak = "Qual é esta cor em inglês?";
        q.speakLang = "pt-BR";
        q.speakLabel = "🔊 Ouvir a pergunta";
        q.swatch = cc.h;
        q.answer = cc.en;
        var enCols = COLORS.map(function(x){return x.en;});
        q.options = shuffle([cc.en].concat(pickOthers(enCols,cc.en,2)));
        q.optLang = "en-US";
      } else {
        // palavra em inglês -> escolher a cor
        q.text = "Toque na cor "+cc.en;
        q.speak = cc.en;
        q.speakLang = "en-US";
        q.speakLabel = "🔊 Ouvir a palavra";
        q.visual = cc.en;
        q.answer = cc.h;
        var hexes = COLORS.map(function(x){return x.h;});
        q.options = shuffle([cc.h].concat(pickOthers(hexes,cc.h,2)));
        q.optSwatch = true;
        q.autoSpeak = true;
      }
    } else {
      var c = COLORS[rand(COLORS.length)];
      q.text = "Que cor é esta?";
      q.speak = "Que cor é esta?";
      q.swatch = c.h;
      q.answer = c.n;
      var names = COLORS.map(function(x){return x.n;});
      q.options = shuffle([q.answer].concat(pickOthers(names,q.answer,2)));
    }
    return q;
  }

  function renderQuestion(){
    current = makeQuestion();
    el("progress").textContent = (qIndex+1)+"/"+TOTAL;
    var bar=""; for(var i=0;i<stars;i++) bar+="⭐";
    el("starBar").textContent = bar;
    el("qtext").textContent = current.text;
    var v = el("qvisual");
    if(current.swatch){
      v.innerHTML = '<div class="swatch" style="background:'+current.swatch+'"></div>';
    } else {
      v.textContent = current.visual;
    }
    var opts = el("options"); opts.innerHTML = "";
    current.options.forEach(function(o){
      var b = document.createElement("button");
      b.className="opt";
      if(current.optSwatch){ b.innerHTML='<span class="dot" style="background:'+o+'"></span>'; b.setAttribute("aria-label","cor"); }
      else { b.textContent=o; }
      b.addEventListener("click",function(){ choose(b,o); });
      opts.appendChild(b);
    });
    el("speakBtn").textContent = current.speakLabel || "🔊 Ouvir a pergunta";
    say(current.text);
    if(current.autoSpeak){ setTimeout(function(){ if(current) speak(current.speak,current.speakLang); },450); }
  }

  function choose(btn,val){
    if(!answering) return;
    if(val===current.answer){
      answering=false;
      btn.classList.add("ok");
      playCorrect();
      if(!mistakes) stars++;
      var delay = 1100;
      if(game==="ingles"||game==="coresen"){
        var w = current.word;
        say(PRAISE[rand(PRAISE.length)]+"  "+w.en+" = "+w.pt+" "+w.e);
        setTimeout(function(){ speak(w.en,"en-US"); },350);
        delay = 2200;
      } else {
        say(PRAISE[rand(PRAISE.length)]);
      }
      celebrate();
      setTimeout(next, delay);
    } else {
      mistakes=true;
      btn.classList.add("no");
      playWrong();
      if(current.optLang){ setTimeout(function(){ speak(val,current.optLang); },300); }
      btn.disabled=true;
      say(TRY_AGAIN[rand(TRY_AGAIN.length)]);
      mouth.setAttribute("d","M90 134 q10 -6 20 0");
      setTimeout(function(){ mouth.setAttribute("d","M88 132 q12 10 24 0"); },900);
    }
  }

  function next(){
    qIndex++;
    if(qIndex>=TOTAL) return finish();
    renderQuestion();
  }

  function finish(){
    el("gameScreen").classList.add("hidden");
    el("endScreen").classList.remove("hidden");
    var s=""; for(var i=0;i<stars;i++) s+="⭐";
    if(!s) s="🙂";
    el("endStars").textContent = s;
    el("endTitle").textContent = stars>=8 ? "Parabéns!" : (stars>=5 ? "Muito bem!" : "Boa tentativa!");
    el("endMsg").textContent = "Você ganhou "+stars+" estrela"+(stars===1?"":"s")+" de "+TOTAL+"!";
    var prev = parseInt(store("clarinha-best-"+game)||"-1",10);
    var isRecord = stars>prev;
    if(isRecord) store("clarinha-best-"+game,String(stars));
    el("endRecord").style.display = isRecord && stars>0 ? "inline-block" : "none";
    say(stars>=8 ? "Você é incrível! 🎉" : "Vamos brincar mais? 💜");
    if(stars>=8){ celebrate(); playWin(); } else { playCorrect(); }
    RK.setKey("clarinha-"+game);
    el("rankLine").textContent = RK.line(RK.submit(stars));
    refreshRecords();
  }

  function startGame(g){
    game=g; qIndex=0; stars=0;
    el("menuScreen").classList.add("hidden");
    el("endScreen").classList.add("hidden");
    el("gameScreen").classList.remove("hidden");
    renderQuestion();
  }

  function toMenu(){
    try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
    el("gameScreen").classList.add("hidden");
    el("endScreen").classList.add("hidden");
    el("menuScreen").classList.remove("hidden");
    say("Oi! Eu sou a Clarinha! Vamos aprender brincando? 💜");
    refreshRecords();
  }

  var menuBtns = document.querySelectorAll(".menu-btn");
  for(var m=0;m<menuBtns.length;m++){
    menuBtns[m].addEventListener("click",function(){ startGame(this.dataset.game); });
  }
  el("voiceBtn").addEventListener("click",cycleVoice);
  el("speakBtn").addEventListener("click",function(){ if(current) speak(current.speak,current.speakLang); });
  el("backBtn").addEventListener("click",toMenu);
  el("menuBtn").addEventListener("click",toMenu);
  el("againBtn").addEventListener("click",function(){ startGame(game); });

  refreshRecords();
  RK.init();
})();
</script>
<script>
(function(){
  var wrap=document.getElementById('installWrap'), btn=document.getElementById('installBtn');
  if(!wrap||!btn) return;
  var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone;
  if(standalone) return;
  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; wrap.hidden=false; });
  btn.addEventListener('click',function(){
    if(!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred=null; wrap.hidden=true; });
  });
  window.addEventListener('appinstalled',function(){ wrap.hidden=true; });
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
    btn.textContent='📲 No iPhone: toque em Compartilhar e depois em Adicionar à Tela de Início';
    btn.disabled=true; wrap.hidden=false;
  }
})();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
