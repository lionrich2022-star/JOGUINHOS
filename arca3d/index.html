<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arca de Noé 3D</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  /* layout: título, palco 3D (canvas) com placar e telas por cima, nome, ranking, rodapé */
  --bg:#eef2ff; --panel:#ffffff; --line:#d5dcf7; --text:#141a3a; --muted:#5a6390;
  --accent:#3b82f6; --gold:#d99a06; --shadow:0 10px 28px rgba(20,26,58,.15);
  --font-display:"Baloo 2","Nunito",system-ui,sans-serif; --font-body:"Nunito",system-ui,sans-serif;
  --w:min(96vw,980px); --rkw:520px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#060716; --panel:#121433; --line:#262a5c; --text:#eef0ff; --muted:#9ea4d8; --accent:#60a5fa; --gold:#fcd34d; --shadow:0 10px 28px rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#060716; --panel:#121433; --line:#262a5c; --text:#eef0ff; --muted:#9ea4d8; --accent:#60a5fa; --gold:#fcd34d; --shadow:0 10px 28px rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);display:flex;flex-direction:column;align-items:center;padding:10px;gap:10px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;transition:background .3s,color .3s}
header{width:var(--w);display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--font-display);font-size:clamp(1.3rem,5vw,1.8rem);
  background:linear-gradient(90deg,#f87171,#facc15,#4ade80,#60a5fa,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hbtns{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);font-size:1.15rem}
.icon-btn svg{width:20px;height:20px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#stage{position:relative;width:var(--w);height:clamp(420px,72vh,620px);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:#5a6478}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;pointer-events:none;color:#fff;font-weight:800;text-shadow:0 2px 6px rgba(0,0,0,.7)}
#hud.hidden{display:none}
.hl b{font-family:var(--font-display);font-size:1.6rem;line-height:1;color:#fde68a;display:block}
.hl small{font-size:.7rem;opacity:.8;text-transform:uppercase;letter-spacing:.06em}
#hSetor{font-family:var(--font-display);font-size:1.05rem;background:rgba(10,12,40,.55);border:1px solid rgba(255,255,255,.2);padding:3px 12px;border-radius:999px}
.hr{display:flex;align-items:center;gap:8px}
#hC{font-family:var(--font-display);font-size:1.1rem;background:rgba(10,12,40,.55);padding:2px 10px;border-radius:12px;letter-spacing:1px}
#hC:empty{display:none}
#actBtn{position:absolute;right:12px;bottom:14px;width:72px;height:72px;border-radius:50%;border:3px solid #fbbf24;background:radial-gradient(circle,#78350f,#1c0a04);color:#fff;font-size:1.8rem;cursor:pointer;box-shadow:0 0 18px rgba(251,191,36,.55);display:flex;align-items:center;justify-content:center;gap:2px;touch-action:manipulation}
#actBtn span{font-family:var(--font-display);font-size:1.1rem;font-weight:800}
#actBtn.hidden{display:none}
#actBtn.empty{opacity:.4;box-shadow:none}
.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opt{border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:14px;padding:8px 12px;font:inherit;font-weight:800;cursor:pointer;min-width:110px}
.opt small{display:block;font-weight:700;opacity:.75;font-size:.72rem}
.opt.on{border-color:#facc15;background:rgba(250,204,21,.18)}
.colors{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cbtn{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.35);cursor:pointer}
.cbtn.on{border-color:#fff;transform:scale(1.15)}
.podium{font-size:3rem;line-height:1}
#pauseBtn{pointer-events:auto;width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(10,12,40,.55);color:#fff;font-size:1.05rem;cursor:pointer}
#rajBar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(70%,340px);height:22px;border-radius:999px;background:rgba(10,12,40,.6);border:2px solid #ffb04a;overflow:hidden;display:none;pointer-events:none}
#rajBar.on{display:block}
#rajFill{height:100%;width:100%;background:linear-gradient(90deg,#60a5fa,#a78bfa)}
#rajBar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#fff;text-shadow:0 1px 3px #000}
#shieldTag{position:absolute;left:12px;bottom:14px;font-size:1.6rem;filter:drop-shadow(0 0 8px #48a8ff);display:none;pointer-events:none}
#shieldTag.on{display:block}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--font-display);font-size:clamp(1.8rem,7vw,3rem);font-weight:800;color:#fff;
  text-shadow:0 0 18px rgba(255,160,64,.9),0 3px 8px #000;opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s;pointer-events:none}
#banner.on{opacity:1;transform:scale(1)}
#hint{position:absolute;left:0;right:0;bottom:60px;text-align:center;color:#fff;font-weight:800;opacity:0;transition:opacity .4s;pointer-events:none;text-shadow:0 2px 6px #000}
#hint.on{opacity:1}
#ov{position:absolute;inset:0;background:rgba(5,6,22,.78);color:#fff;display:flex;flex-direction:column;align-items:center;padding:14px;gap:10px;overflow:auto;line-height:1.35}
#ov.hidden{display:none}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.08);padding:4px;border-radius:999px;flex:none}
.tab{border:0;background:transparent;color:#cfd5ff;font:inherit;font-weight:800;padding:8px 16px;border-radius:999px;cursor:pointer}
.tab.on{background:#fff;color:#141a3a}
.ovbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;width:100%;max-width:560px}
.title{font-family:var(--font-display);font-size:clamp(2rem,7vw,3rem);font-weight:800;background:linear-gradient(90deg,#7dd3fc,#c4b5fd,#f9a8d4,#fde68a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;line-height:1.1}
.big{font-family:var(--font-display);font-size:1.9rem;font-weight:800}
.info{font-size:1.1rem;color:#fde68a;font-weight:800}
.tip{font-weight:700;opacity:.9;max-width:420px}
.rkl{font-weight:800;color:#a5f3fc}
.ob{border:0;border-radius:999px;padding:12px 28px;cursor:pointer;font-family:var(--font-display);font-size:1.15rem;font-weight:800;color:#1a1033;background:linear-gradient(135deg,#7dd3fc,#c4b5fd);box-shadow:0 8px 24px rgba(125,211,252,.35)}
.ob.alt{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
.help{text-align:left;font-weight:700;font-size:.92rem;display:flex;flex-direction:column;gap:4px;width:100%}
.help h3{font-family:var(--font-display);font-size:1.05rem;color:#fde68a;margin-top:6px}
.help ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.help li{display:flex;gap:8px;align-items:flex-start}
.dot{width:14px;height:14px;border-radius:50%;flex:none;margin-top:3px;box-shadow:0 0 10px currentColor}
.dot.o{background:#ff7a1a;color:#ff7a1a} .dot.b{background:#48a8ff;color:#48a8ff} .dot.y{background:#ffd23a;color:#ffd23a}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow)}
.nm-wrap{width:min(96vw,520px)}
footer{margin-top:auto;padding-top:6px;color:var(--muted);font-size:.72rem;font-weight:600;letter-spacing:.03em}
@media (prefers-reduced-motion:reduce){#banner{transition:none}}
/* nome do jogador e ranking */
.nm-wrap{display:flex;flex-direction:column;gap:4px;align-items:center}
.nm-label{font-size:.78rem;font-weight:800;color:var(--muted)}
.nm-input{width:min(230px,72vw);text-align:center;font:inherit;font-weight:800;font-size:1rem;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text)}
.nm-input:focus{outline:none;border-color:var(--accent)}
.nm-row{display:flex;gap:8px;align-items:center;justify-content:center;width:min(94vw,var(--rkw,440px))}
.nm-row .nm-input{flex:1;max-width:260px;text-align:left}
.nm-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.rk-card{width:min(94vw,var(--rkw,440px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.screen .rk-card{width:100%}
.rk-title{font-family:var(--font-display);font-weight:800;font-size:1.05rem}
.rk-row{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.92rem;padding:4px 8px;border-radius:10px}
.rk-row.me{background:var(--accent-soft)}
.rk-pos{width:2rem;text-align:center;flex:none}
.rk-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-score{color:var(--accent);font-variant-numeric:tabular-nums;flex:none}
.rk-empty{color:var(--muted);font-weight:700;font-size:.85rem}
.rk-line{font-weight:800;color:var(--accent);text-align:center;text-wrap:balance;min-height:1.2em}
#overOverlay .emoji,#winOverlay .emoji{font-size:2.1rem}
#overOverlay,#winOverlay{gap:7px}
.overlay{overflow-y:auto;justify-content:safe center}

</style>

#installWrap button{background:none;border:none;color:var(--accent);font:inherit;font-weight:800;

<body>
<header>
  <h1>🚢 Arca de Noé 3D</h1>
  <div class="hbtns">
    <button class="icon-btn" id="helpBtn" aria-label="Como jogar" title="Como jogar">❓</button>
    <button class="icon-btn" id="soundBtn" aria-label="Som ligado/desligado" title="Som"><span id="soundIcon">🔊</span></button>
    <button class="icon-btn" id="themeBtn" aria-label="Trocar tema" title="Trocar tema">
      <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<div id="stage">
  <canvas id="c" aria-label="Arca de Noé 3D"></canvas>
  <div id="hud" class="hidden"><div class="hl"><b id="hA">0</b><small id="hAl">pontos</small></div><div id="hB">—</div><div class="hr"><span id="hC"></span><button id="pauseBtn" aria-label="Pausar">⏸</button></div></div>
  <div id="rajBar"><div id="rajFill"></div><span id="rajLabel"></span></div>
  <button id="actBtn" class="hidden" aria-label="Ação"></button>
  <div id="banner"></div>
  <div id="hint"></div>
  <div id="ov"></div>
</div>
<div class="card nm-wrap"><label class="nm-label" for="nameMenu">Quem vai pilotar a arca?</label><input class="nm-input" id="nameMenu" maxlength="12" placeholder="Escreva seu nome" autocomplete="off"></div>
<section class="rk-card" aria-label="Ranking"><div class="rk-title" id="rkTitle">🏆 Ranking</div><div id="rkList"></div></section>
<footer>Criado por Wesley de Jesus<span id="installWrap" hidden> · <button id="installBtn" type="button">📲 Instalar no aparelho</button></span></footer>
<script>
(function(){
  "use strict";
  /* ===== Jogador e ranking (fica salvo neste aparelho) ===== */
  var NAME_KEY = "joguinhos-jogador";
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function cleanName(n){ return String(n==null?"":n).replace(/\s+/g," ").trim().slice(0,12); }

  function makeRanking(cfg){
    var key = cfg.key, low = !!cfg.low;
    function storeKey(){ return "joguinhos-rank-"+key; }
    function readList(){
      try{ var a = JSON.parse(lsGet(storeKey())||"[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; }
    }
    function cmp(x,y){
      return low ? (x.s-y.s)||((x.t||0)-(y.t||0)) : (y.s-x.s)||((x.d||0)-(y.d||0));
    }
    function nameNow(){ return cleanName(lsGet(NAME_KEY)) || "Jogador"; }
    function rowsAll(){ return cfg.rows ? cfg.rows() : readList().sort(cmp); }
    function render(){
      var box = document.getElementById("rkList"); if(!box) return;
      var rows = rowsAll().slice(0,5), me = nameNow().toLowerCase();
      box.textContent = "";
      if(!rows.length){
        var e = document.createElement("div"); e.className = "rk-empty";
        e.textContent = "Ninguém no ranking ainda. Seja o primeiro!"; box.appendChild(e); return;
      }
      var medals = ["🥇","🥈","🥉"];
      rows.forEach(function(r,i){
        var d = document.createElement("div");
        d.className = "rk-row" + (String(r.n).toLowerCase()===me ? " me" : "");
        var a = document.createElement("span"); a.className = "rk-pos"; a.textContent = medals[i] || (i+1)+"º";
        var b = document.createElement("span"); b.className = "rk-name"; b.textContent = r.n;
        var c = document.createElement("span"); c.className = "rk-score"; c.textContent = cfg.fmt ? cfg.fmt(r) : r.s;
        d.appendChild(a); d.appendChild(b); d.appendChild(c); box.appendChild(d);
      });
    }
    // registra a pontuação (guarda só a melhor de cada jogador) e devolve a posição
    function submit(score, extra){
      if(!(score>0)) return null;
      var name = nameNow(), id = name.toLowerCase(), a = readList(), found = -1;
      for(var i=0;i<a.length;i++){ if(String(a[i].n).toLowerCase()===id){ found = i; break; } }
      var entry = {n:name, s:score, t:extra||0, d:Date.now()};
      if(found>=0){ if(cmp(entry,a[found])<0) a[found] = entry; } else { a.push(entry); }
      a.sort(cmp); a = a.slice(0,50);
      lsSet(storeKey(), JSON.stringify(a));
      var rows = rowsAll(), pos = 0;
      for(var j=0;j<rows.length;j++){ if(String(rows[j].n).toLowerCase()===id){ pos = j+1; break; } }
      render();
      return {name:name, pos:pos};
    }
    function line(res){
      if(!res || !res.pos) return "";
      return res.pos===1 ? "🥇 "+res.name+" está em 1º lugar no ranking!" : "🏅 "+res.name+" está em "+res.pos+"º lugar no ranking";
    }
    function init(){
      var inputs = document.querySelectorAll(".nm-input"), saved = cleanName(lsGet(NAME_KEY));
      Array.prototype.forEach.call(inputs,function(inp){
        inp.value = saved;
        inp.addEventListener("input",function(){
          lsSet(NAME_KEY, cleanName(inp.value));
          Array.prototype.forEach.call(inputs,function(o){ if(o!==inp) o.value = inp.value; });
          render();
        });
      });
      render();
    }
    return {init:init, render:render, submit:submit, line:line, name:nameNow,
            setKey:function(k){ key = k; render(); }};
  }

  window.makeRanking = makeRanking; window.lsGet = lsGet; window.lsSet = lsSet;
})();
</script>
