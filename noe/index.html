<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A Arca de Noé</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  /* layout: coluna única — título, telas (menu, história, quiz, ordem, fim), ranking, rodapé */
  --bg:#e9f4ff; --panel:#ffffff; --line:#cfe0f3; --text:#17304d; --muted:#56708f;
  --accent:#0284c7; --accent-soft:#e0f2fe; --gold:#d99a06; --ok:#16a34a; --bad:#e11d48;
  --shadow:0 10px 30px rgba(23,48,77,.14);
  --font-display:"Baloo 2","Nunito",system-ui,sans-serif; --font-body:"Nunito",system-ui,sans-serif;
  --w:min(94vw,480px); --rkw:480px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#0c1a2e; --panel:#15283f; --line:#26405f; --text:#eaf3ff; --muted:#9bb5d6;
    --accent:#38bdf8; --accent-soft:#12324d; --gold:#fbbf24; --ok:#4ade80; --bad:#fb7185; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1a2e; --panel:#15283f; --line:#26405f; --text:#eaf3ff; --muted:#9bb5d6;
  --accent:#38bdf8; --accent-soft:#12324d; --gold:#fbbf24; --ok:#4ade80; --bad:#fb7185; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
header{width:var(--w);display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--font-display);font-size:clamp(1.3rem,5vw,1.7rem);
  background:linear-gradient(90deg,#f87171,#fbbf24,#4ade80,#38bdf8,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hbtns{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);font-size:1.15rem}
.icon-btn svg{width:20px;height:20px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.screen{width:var(--w);display:none;flex-direction:column;gap:10px;align-items:center}
.screen.on{display:flex}
.card{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.hero{width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.hero svg,.scene svg{display:block;width:100%;height:auto}
.menu-btn{width:100%;display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 14px;color:var(--text);
  font:inherit;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .12s}
.menu-btn:active{transform:scale(.98)}
.menu-btn .ic{font-size:2rem;line-height:1}
.menu-btn b{font-family:var(--font-display);font-size:1.15rem;display:block}
.menu-btn small{color:var(--muted);font-weight:800}
.menu-btn .rec{display:block;color:var(--gold);font-weight:800;font-size:.8rem}
.bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem;box-shadow:var(--shadow)}
.pill b{color:var(--accent)}
.back{border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-weight:800;border-radius:999px;padding:7px 14px;cursor:pointer;box-shadow:var(--shadow)}
.scene{width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:#9bd4ff}
.story-text{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-height:132px}
.story-text h2{font-family:var(--font-display);font-size:1.2rem;margin-bottom:4px}
.story-text p{font-size:1.02rem;font-weight:700;line-height:1.45}
.story-text .ref{display:block;margin-top:6px;color:var(--muted);font-size:.8rem;font-weight:800}
.nav{width:100%;display:flex;gap:8px}
.btn{flex:1;border:none;cursor:pointer;background:linear-gradient(135deg,#38bdf8,#0284c7);color:#fff;font-family:var(--font-display);font-weight:800;font-size:1.02rem;
  padding:11px 16px;border-radius:999px;box-shadow:0 8px 20px rgba(2,132,199,.35);transition:transform .12s}
.btn.alt{background:var(--panel);color:var(--text);border:2px solid var(--line);box-shadow:none}
.btn.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#2a1b00;box-shadow:0 8px 20px rgba(245,158,11,.35)}
.btn:active{transform:scale(.96)} .btn:disabled{opacity:.45;box-shadow:none}
.q{font-family:var(--font-display);font-weight:800;font-size:1.25rem;text-wrap:balance;text-align:center;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:8px;width:100%}
.opt{width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);color:var(--text);font:inherit;font-weight:800;font-size:1.02rem;border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--panel))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--panel))}
.opt:disabled{cursor:default}
.fb{width:100%;min-height:3.4em;text-align:center;font-weight:800;text-wrap:balance}
.fb small{display:block;color:var(--muted);margin-top:2px}
.order-list{width:100%;display:flex;flex-direction:column;gap:7px}
.ev{width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);color:var(--text);font:inherit;font-weight:800;border-radius:14px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.ev .n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--font-display)}
.ev.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--panel));cursor:default}
.ev.done .n{background:var(--ok);color:#fff}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.stars{font-size:2.4rem;letter-spacing:4px;text-align:center}
.end-title{font-family:var(--font-display);font-weight:800;font-size:1.5rem;text-align:center;text-wrap:balance}
.end-sub{text-align:center;font-weight:700;color:var(--muted);text-wrap:balance}
.verse{width:100%;text-align:center;font-weight:800;color:var(--gold);text-wrap:balance}
footer{margin-top:auto;padding-top:6px;color:var(--muted);font-size:.72rem;font-weight:600;letter-spacing:.03em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* nome do jogador e ranking */
.nm-wrap{display:flex;flex-direction:column;gap:4px;align-items:center}
.nm-label{font-size:.78rem;font-weight:800;color:var(--muted)}
.nm-input{width:min(230px,72vw);text-align:center;font:inherit;font-weight:800;font-size:1rem;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text)}
.nm-input:focus{outline:none;border-color:var(--accent)}
.nm-row{display:flex;gap:8px;align-items:center;justify-content:center;width:min(94vw,var(--rkw,440px))}
.nm-row .nm-input{flex:1;max-width:260px;text-align:left}
.nm-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.rk-card{width:min(94vw,var(--rkw,440px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.screen .rk-card{width:100%}
.rk-title{font-family:var(--font-display);font-weight:800;font-size:1.05rem}
.rk-row{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.92rem;padding:4px 8px;border-radius:10px}
.rk-row.me{background:var(--accent-soft)}
.rk-pos{width:2rem;text-align:center;flex:none}
.rk-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-score{color:var(--accent);font-variant-numeric:tabular-nums;flex:none}
.rk-empty{color:var(--muted);font-weight:700;font-size:.85rem}
.rk-line{font-weight:800;color:var(--accent);text-align:center;text-wrap:balance;min-height:1.2em}
#overOverlay .emoji,#winOverlay .emoji{font-size:2.1rem}
#overOverlay,#winOverlay{gap:7px}
.overlay{overflow-y:auto;justify-content:safe center}

</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A Arca de Noé">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
#installWrap button{background:none;border:none;color:var(--accent);font:inherit;font-weight:800;
  cursor:pointer;text-decoration:underline;padding:0}
#installWrap button:disabled{cursor:default;text-decoration:none;color:var(--muted)}
</style>
</head>
<body>

<header>
  <h1>🌈 A Arca de Noé</h1>
  <div class="hbtns">
    <button class="icon-btn" id="soundBtn" aria-label="Som ligado/desligado" title="Som"><span id="soundIcon">🔊</span></button>
    <button class="icon-btn" id="themeBtn" aria-label="Trocar tema" title="Trocar tema">
      <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<!-- MENU -->
<div class="screen on" id="sMenu">
  <div class="hero" id="hero"></div>
  <div class="card nm-wrap"><label class="nm-label" for="nameMenu">Quem vai brincar?</label><input class="nm-input" id="nameMenu" maxlength="12" placeholder="Escreva seu nome" autocomplete="off"></div>
  <button class="menu-btn" id="mStory"><span class="ic">📖</span><span><b>A história de Noé</b><small>Leia e ouça, página por página</small></span></button>
  <button class="menu-btn" id="mQuiz"><span class="ic">❓</span><span><b>Quiz da Arca</b><small>10 perguntas sobre a história</small><span class="rec" id="recQuiz"></span></span></button>
  <button class="menu-btn" id="mOrder"><span class="ic">🔢</span><span><b>Ordene a história</b><small>Coloque os fatos na ordem certa</small><span class="rec" id="recOrder"></span></span></button>
</div>

<!-- HISTÓRIA -->
<div class="screen" id="sStory">
  <div class="bar"><button class="back" id="stBack">← Menu</button><span class="pill">Página <b id="stPg">1</b>/8</span></div>
  <div class="scene" id="scene"></div>
  <div class="story-text"><h2 id="stTitle"></h2><p id="stText"></p><span class="ref" id="stRef"></span></div>
  <div class="nav"><button class="btn alt" id="stPrev">◀ Voltar</button><button class="btn alt" id="stSpeak" aria-label="Ouvir esta página">🔊 Ouvir</button><button class="btn" id="stNext">Próxima ▶</button></div>
</div>

<!-- QUIZ -->
<div class="screen" id="sQuiz">
  <div class="bar"><button class="back" id="qBack">← Menu</button><span class="pill">Pergunta <b id="qN">1</b>/10</span><span class="pill">Pontos <b id="qPts">0</b></span></div>
  <div class="card"><div class="q" id="qText"></div><div class="opts" id="qOpts"></div></div>
  <div class="fb" id="qFb"></div>
  <div class="nav"><button class="btn gold" id="qNext" disabled>Próxima ▶</button></div>
</div>

<!-- ORDEM -->
<div class="screen" id="sOrder">
  <div class="bar"><button class="back" id="oBack">← Menu</button><span class="pill">Erros <b id="oErr">0</b></span><span class="pill">Certos <b id="oOk">0</b>/6</span></div>
  <div class="card"><div class="q" style="margin-bottom:0">Toque nos fatos na ordem em que aconteceram. O primeiro é o 1º!</div></div>
  <div class="order-list" id="oList"></div>
  <div class="fb" id="oFb"></div>
</div>

<!-- FIM -->
<div class="screen" id="sEnd">
  <div class="card" style="display:flex;flex-direction:column;gap:8px;align-items:center">
    <div class="stars" id="eStars"></div>
    <div class="end-title" id="eTitle"></div>
    <div class="end-sub" id="eSub"></div>
    <div class="verse" id="eVerse"></div>
    <div class="rk-line" id="rankLine"></div>
    <div class="nm-wrap"><label class="nm-label" for="nameOver">Próximo jogador:</label><input class="nm-input" id="nameOver" maxlength="12" placeholder="Escreva seu nome" autocomplete="off"></div>
  </div>
  <div class="nav"><button class="btn gold" id="eAgain">Jogar de novo</button><button class="btn alt" id="eMenu">Menu</button></div>
</div>

<section class="rk-card" aria-label="Ranking"><div class="rk-title" id="rkTitle">🏆 Ranking</div><div id="rkList"></div></section>

<footer>Criado por Wesley de Jesus<span id="installWrap" hidden> · <button id="installBtn" type="button">📲 Instalar no aparelho</button></span></footer>

<script>
(function(){
  "use strict";
  /* ===== Jogador e ranking (fica salvo neste aparelho) ===== */
  var NAME_KEY = "joguinhos-jogador";
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function cleanName(n){ return String(n==null?"":n).replace(/\s+/g," ").trim().slice(0,12); }

  function makeRanking(cfg){
    var key = cfg.key, low = !!cfg.low;
    function storeKey(){ return "joguinhos-rank-"+key; }
    function readList(){
      try{ var a = JSON.parse(lsGet(storeKey())||"[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; }
    }
    function cmp(x,y){
      return low ? (x.s-y.s)||((x.t||0)-(y.t||0)) : (y.s-x.s)||((x.d||0)-(y.d||0));
    }
    function nameNow(){ return cleanName(lsGet(NAME_KEY)) || "Jogador"; }
    function rowsAll(){ return cfg.rows ? cfg.rows() : readList().sort(cmp); }
    function render(){
      var box = document.getElementById("rkList"); if(!box) return;
      var rows = rowsAll().slice(0,5), me = nameNow().toLowerCase();
      box.textContent = "";
      if(!rows.length){
        var e = document.createElement("div"); e.className = "rk-empty";
        e.textContent = "Ninguém no ranking ainda. Seja o primeiro!"; box.appendChild(e); return;
      }
      var medals = ["🥇","🥈","🥉"];
      rows.forEach(function(r,i){
        var d = document.createElement("div");
        d.className = "rk-row" + (String(r.n).toLowerCase()===me ? " me" : "");
        var a = document.createElement("span"); a.className = "rk-pos"; a.textContent = medals[i] || (i+1)+"º";
        var b = document.createElement("span"); b.className = "rk-name"; b.textContent = r.n;
        var c = document.createElement("span"); c.className = "rk-score"; c.textContent = cfg.fmt ? cfg.fmt(r) : r.s;
        d.appendChild(a); d.appendChild(b); d.appendChild(c); box.appendChild(d);
      });
    }
    // registra a pontuação (guarda só a melhor de cada jogador) e devolve a posição
    function submit(score, extra){
      if(!(score>0)) return null;
      var name = nameNow(), id = name.toLowerCase(), a = readList(), found = -1;
      for(var i=0;i<a.length;i++){ if(String(a[i].n).toLowerCase()===id){ found = i; break; } }
      var entry = {n:name, s:score, t:extra||0, d:Date.now()};
      if(found>=0){ if(cmp(entry,a[found])<0) a[found] = entry; } else { a.push(entry); }
      a.sort(cmp); a = a.slice(0,50);
      lsSet(storeKey(), JSON.stringify(a));
      var rows = rowsAll(), pos = 0;
      for(var j=0;j<rows.length;j++){ if(String(rows[j].n).toLowerCase()===id){ pos = j+1; break; } }
      render();
      return {name:name, pos:pos};
    }
    function line(res){
      if(!res || !res.pos) return "";
      return res.pos===1 ? "🥇 "+res.name+" está em 1º lugar no ranking!" : "🏅 "+res.name+" está em "+res.pos+"º lugar no ranking";
    }
    function init(){
      var inputs = document.querySelectorAll(".nm-input"), saved = cleanName(lsGet(NAME_KEY));
      Array.prototype.forEach.call(inputs,function(inp){
        inp.value = saved;
        inp.addEventListener("input",function(){
          lsSet(NAME_KEY, cleanName(inp.value));
          Array.prototype.forEach.call(inputs,function(o){ if(o!==inp) o.value = inp.value; });
          render();
        });
      });
      render();
    }
    return {init:init, render:render, submit:submit, line:line, name:nameNow,
            setKey:function(k){ key = k; render(); }};
  }

  var RK = makeRanking({key:"noe-quiz", fmt:function(r){ return r.s+" pts"; }});
  var $ = function(id){ return document.getElementById(id); };

  /* ---------- tema e som ---------- */
  var savedTheme = lsGet("noe-theme");
  if(savedTheme==="light"||savedTheme==="dark") document.documentElement.setAttribute("data-theme",savedTheme);
  function syncTheme(){ var dark = document.documentElement.getAttribute("data-theme")!=="light"; $("iconSun").style.display = dark?"":"none"; $("iconMoon").style.display = dark?"none":""; }
  syncTheme();
  $("themeBtn").addEventListener("click",function(){
    var next = document.documentElement.getAttribute("data-theme")!=="light"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next); lsSet("noe-theme",next); syncTheme();
  });
  var soundOn = lsGet("noe-sound")!=="0", ac = null;
  function syncSound(){ $("soundIcon").textContent = soundOn?"🔊":"🔇"; }
  syncSound();
  function tone(f,st,d,type,v,slide){
    if(!soundOn) return;
    if(!ac){ var C = window.AudioContext||window.webkitAudioContext; if(C) ac = new C(); }
    if(!ac) return; if(ac.state==="suspended") ac.resume();
    var t = ac.currentTime+st, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.03);
  }
  function sTap(){ tone(660,0,0.07,"triangle",0.1); }
  function sOk(){ tone(660,0,0.14,"triangle",0.16); tone(880,0.1,0.14,"triangle",0.16); tone(1175,0.2,0.22,"triangle",0.16); }
  function sBad(){ tone(220,0,0.2,"sawtooth",0.1,150); tone(160,0.14,0.26,"sawtooth",0.1,110); }
  function sPage(){ tone(520,0,0.08,"sine",0.1,700); }
  function sWin(){ [523,659,784,1047,1319].forEach(function(f,i){ tone(f,i*0.12,0.3,"triangle",0.17); }); tone(1047,0.7,0.6,"sine",0.13); }
  $("soundBtn").addEventListener("click",function(){ soundOn=!soundOn; lsSet("noe-sound",soundOn?"1":"0"); syncSound(); if(soundOn) sTap(); else stopSpeak(); });

  /* ---------- voz (narração) ---------- */
  var voices = [], voice = null;
  function pickVoice(){
    voices = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
    var best = null, bs = -1;
    voices.forEach(function(v){
      if(!/^pt/i.test(v.lang)) return; var s = 1, n = v.name.toLowerCase();
      if(/pt[-_]br/i.test(v.lang)) s += 2;
      if(/luciana|francisca|maria|vit[oó]ria|feminina|female|google portugu[eê]s/.test(n)) s += 3;
      if(/daniel|felipe|male|masculin/.test(n)) s -= 2;
      if(s>bs){ bs = s; best = v; }
    });
    voice = best;
  }
  if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function stopSpeak(){ try{ speechSynthesis.cancel(); }catch(e){} }
  function speak(t){
    if(!window.speechSynthesis || !soundOn) return; stopSpeak();
    var u = new SpeechSynthesisUtterance(t); u.lang = "pt-BR"; if(voice) u.voice = voice; u.rate = 0.92; u.pitch = 1.08; speechSynthesis.speak(u);
  }

  /* ---------- ilustrações ---------- */
  function person(x,y,s,robe,hair,beard){
    return '<g transform="translate('+x+' '+y+') scale('+s+')"><path d="M-11 0 L-14 -30 Q0 -42 14 -30 L11 0 Z" fill="'+robe+'"/>'+
      '<circle cx="0" cy="-41" r="9.5" fill="#f1c9a0"/><path d="M-10 -42 Q0 -58 10 -42 Q0 -49 -10 -42Z" fill="'+hair+'"/>'+
      (beard?'<path d="M-8 -38 Q0 -20 8 -38 Q0 -32 -8 -38Z" fill="#f2f2f2"/>':'')+

    var best = parseInt(lsGet("noe-best-ordem")||"0",10)||0, rec = pts>best; if(rec) lsSet("noe-best-ordem",String(pts));
    var res = RK.submit(pts);
    finish({stars:stars,title:oErr===0?"Perfeito! Você sabe a história na ordem!":"Muito bem! A história está na ordem certa.",sub:"Erros: "+oErr+" · Pontos: "+pts+(rec?" 🏆 Novo recorde!":""),
      verse:"Deus cumpre as suas promessas. (Gênesis 9:11-13)",line:RK.line(res),again:startOrder});
    refreshRecs();
  }

  /* ---------- fim, telas e menu ---------- */
  var againFn = null;
  function finish(o){
    $("eStars").textContent = "★".repeat(o.stars)+"☆".repeat(3-o.stars); $("eStars").style.color = "var(--gold)";
    $("eTitle").textContent = o.title; $("eSub").textContent = o.sub; $("eVerse").textContent = "📖 "+o.verse; $("rankLine").textContent = o.line; againFn = o.again;
    show("sEnd"); if(o.stars>=2) sWin(); else sTap();
  }
  function show(id){ ["sMenu","sStory","sQuiz","sOrder","sEnd"].forEach(function(s){ $(s).classList.toggle("on",s===id); }); stopSpeak(); window.scrollTo(0,0); }
  function refreshRecs(){
    var a = lsGet("noe-best-quiz"), b = lsGet("noe-best-ordem");
    $("recQuiz").textContent = a ? "🏆 Recorde: "+a+" pontos" : ""; $("recOrder").textContent = b ? "🏆 Recorde: "+b+" pontos" : "";
  }
  $("mStory").addEventListener("click",function(){ sTap(); show("sStory"); showPage(0); });
  $("mQuiz").addEventListener("click",function(){ sTap(); startQuiz(); });
  $("mOrder").addEventListener("click",function(){ sTap(); startOrder(); });
  ["stBack","qBack","oBack","eMenu"].forEach(function(id){ $(id).addEventListener("click",function(){ sTap(); show("sMenu"); }); });
  $("eAgain").addEventListener("click",function(){ if(againFn) againFn(); });
  document.addEventListener("keydown",function(e){
    if(e.target && e.target.tagName==="INPUT" && e.key==="Enter"){ e.preventDefault(); e.target.blur(); }
  });
  RK.init(); refreshRecs(); $("rkTitle").textContent = "🏆 Ranking · Quiz da Arca (pontos)";
  window.__noe = {QS:QS};
})();
</script>
<script>
(function(){
  var wrap=document.getElementById('installWrap'), btn=document.getElementById('installBtn');
  if(!wrap||!btn) return;
  var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone;
  if(standalone) return;
  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; wrap.hidden=false; });
  btn.addEventListener('click',function(){
    if(!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred=null; wrap.hidden=true; });
  });
  window.addEventListener('appinstalled',function(){ wrap.hidden=true; });
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
    btn.textContent='📲 No iPhone: toque em Compartilhar e depois em Adicionar à Tela de Início';
    btn.disabled=true; wrap.hidden=false;
  }
})();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
