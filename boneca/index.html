<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vista a Boneca</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  /* layout: boneca (palco) à esquerda e guarda-roupa à direita no computador; empilhado no celular */
  --bg:#fff1f7; --panel:#ffffff; --line:#f5d0e6; --text:#4a1d3e; --muted:#9d5c86;
  --accent:#db2777; --accent-soft:#fce7f3; --gold:#d99a06;
  --shadow:0 10px 28px rgba(160,40,110,.14);
  --font-display:"Baloo 2","Nunito",system-ui,sans-serif; --font-body:"Nunito",system-ui,sans-serif;
  --rkw:1000px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#1a1020; --panel:#2a1a33; --line:#46304f; --text:#fdf2ff; --muted:#d4b4dc; --accent:#f472b6; --accent-soft:#4a1d3e; --gold:#fbbf24; --shadow:0 10px 28px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1020; --panel:#2a1a33; --line:#46304f; --text:#fdf2ff; --muted:#d4b4dc; --accent:#f472b6; --accent-soft:#4a1d3e; --gold:#fbbf24; --shadow:0 10px 28px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);display:flex;flex-direction:column;align-items:center;padding:10px;gap:10px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s}
header{width:min(96vw,1000px);display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:var(--font-display);font-size:clamp(1.35rem,5vw,1.9rem);
  background:linear-gradient(90deg,#f472b6,#c084fc,#fb7185,#fbbf24);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hbtns{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);font-size:1.15rem}
.icon-btn svg{width:20px;height:20px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.layout{width:min(96vw,1000px);display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:860px){ .layout{grid-template-columns:minmax(340px,420px) 1fr;align-items:start} .stage{height:min(76vh,700px)!important} .tabs{flex-wrap:wrap;overflow:visible!important} }
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage{position:relative;height:min(58vh,600px);border-radius:22px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);display:flex;justify-content:center;background:#fbcfe8;transition:background .3s}
.stage svg{height:100%;width:100%;display:block}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{border:2px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-weight:800;font-size:.8rem;border-radius:14px;padding:8px 4px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:2px}
.tool .e{font-size:1.35rem;line-height:1}
.tool:active{transform:scale(.96)}
.chbar{display:none;background:linear-gradient(135deg,#f472b6,#a855f7);color:#fff;border-radius:18px;padding:10px 12px;align-items:center;gap:10px;box-shadow:var(--shadow)}
.chbar.on{display:flex}
.chbar .ct{flex:1;font-weight:800;line-height:1.25}
.chbar .ct b{font-family:var(--font-display);font-size:1.1rem;display:block}
.chbar button{border:none;border-radius:999px;padding:9px 14px;font:inherit;font-weight:800;cursor:pointer}
.chbar .go{background:#fff;color:#a21caf} .chbar .x{background:rgba(255,255,255,.22);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.tab{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:72px;padding:6px 8px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-weight:800;font-size:.72rem;cursor:pointer}
.tab .e{font-size:1.45rem;line-height:1.1}
.tab.on{border-color:var(--accent);background:var(--accent-soft)}
.ptitle{font-family:var(--font-display);font-weight:800;font-size:1.15rem;margin-bottom:6px}
.sub{font-weight:800;color:var(--muted);font-size:.85rem;margin:12px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.grid.tall .item{aspect-ratio:3/4}
.item{aspect-ratio:1;border:2px solid var(--line);border-radius:14px;background:#fff7fb;padding:3px 3px 16px;cursor:pointer;position:relative;overflow:hidden;color:#5b2a4a}
.item svg{width:100%;height:100%;display:block}
.item .lb{position:absolute;left:0;right:0;bottom:2px;font-size:.64rem;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.item .em{font-size:2rem;display:flex;align-items:center;justify-content:center;height:100%}
.item.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.item.on::after{content:"✓";position:absolute;top:3px;right:5px;background:var(--accent);color:#fff;border-radius:50%;width:18px;height:18px;font-size:.7rem;display:flex;align-items:center;justify-content:center}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--line);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;font-size:1rem;background-clip:padding-box}
.sw.on{border-color:var(--accent);transform:scale(1.12);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.sw.none{background:repeating-linear-gradient(45deg,#fff,#fff 5px,#fbd5e8 5px,#fbd5e8 10px)}
.prints{display:flex;flex-wrap:wrap;gap:8px}
.pr{border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:4px 8px 4px 4px;display:flex;align-items:center;gap:6px;font:inherit;font-weight:800;font-size:.78rem;cursor:pointer}
.pr svg{width:30px;height:30px;border-radius:8px;display:block}
.pr.on{border-color:var(--accent);background:var(--accent-soft)}
.hint{color:var(--muted);font-weight:700;font-size:.82rem;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(20,5,20,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.mcard{background:var(--panel);color:var(--text);border-radius:22px;padding:16px;max-width:430px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.mcard img{max-width:100%;max-height:58vh;border-radius:14px;border:1px solid var(--line)}
.stars{font-size:2.4rem;letter-spacing:4px;color:var(--gold)}
.mt{font-family:var(--font-display);font-weight:800;font-size:1.45rem;text-wrap:balance}
.ms{font-weight:700;color:var(--muted);text-wrap:balance}
.mlist{list-style:none;text-align:left;width:100%;display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:.9rem}
.mlist li{background:var(--accent-soft);border-radius:10px;padding:6px 10px}
.mbtns{display:flex;gap:8px;width:100%}
.btn{flex:1;border:none;cursor:pointer;background:linear-gradient(135deg,#f472b6,#db2777);color:#fff;font-family:var(--font-display);font-weight:800;font-size:1rem;
  padding:11px 14px;border-radius:999px;box-shadow:0 8px 20px rgba(219,39,119,.35);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.alt{background:var(--panel);color:var(--text);border:2px solid var(--line);box-shadow:none}
footer{margin-top:auto;padding-top:6px;color:var(--muted);font-size:.72rem;font-weight:600;letter-spacing:.03em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* nome do jogador e ranking */
.nm-wrap{display:flex;flex-direction:column;gap:4px;align-items:center}
.nm-label{font-size:.78rem;font-weight:800;color:var(--muted)}
.nm-input{width:min(230px,72vw);text-align:center;font:inherit;font-weight:800;font-size:1rem;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text)}
.nm-input:focus{outline:none;border-color:var(--accent)}
.nm-row{display:flex;gap:8px;align-items:center;justify-content:center;width:min(94vw,var(--rkw,440px))}
.nm-row .nm-input{flex:1;max-width:260px;text-align:left}
.nm-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.rk-card{width:min(94vw,var(--rkw,440px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.screen .rk-card{width:100%}
.rk-title{font-family:var(--font-display);font-weight:800;font-size:1.05rem}
.rk-row{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.92rem;padding:4px 8px;border-radius:10px}
.rk-row.me{background:var(--accent-soft)}
.rk-pos{width:2rem;text-align:center;flex:none}
.rk-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-score{color:var(--accent);font-variant-numeric:tabular-nums;flex:none}
.rk-empty{color:var(--muted);font-weight:700;font-size:.85rem}
.rk-line{font-weight:800;color:var(--accent);text-align:center;text-wrap:balance;min-height:1.2em}
#overOverlay .emoji,#winOverlay .emoji{font-size:2.1rem}
#overOverlay,#winOverlay{gap:7px}
.overlay{overflow-y:auto;justify-content:safe center}

</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vista a Boneca">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
#installWrap button{background:none;border:none;color:var(--accent);font:inherit;font-weight:800;
  cursor:pointer;text-decoration:underline;padding:0}
#installWrap button:disabled{cursor:default;text-decoration:none;color:var(--muted)}
</style>
</head>
<body>

<header>
  <h1>👗 Vista a Boneca</h1>
  <div class="hbtns">
    <button class="icon-btn" id="soundBtn" aria-label="Som ligado/desligado" title="Som"><span id="soundIcon">🔊</span></button>
    <button class="icon-btn" id="themeBtn" aria-label="Trocar tema" title="Trocar tema">
      <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main class="layout">
  <section class="col">
    <div class="chbar" id="chBar"><div class="ct" id="chText"></div><button class="go" id="chDone">Pronto!</button><button class="x" id="chExit" aria-label="Sair do desafio">✕</button></div>
    <div class="stage" id="stage"><svg id="doll" viewBox="0 0 300 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A boneca"><g id="dollG"></g><g id="fx"></g></svg></div>
    <div class="tools">
      <button class="tool" id="tRandom"><span class="e">🎲</span>Surpresa</button>
      <button class="tool" id="tClear"><span class="e">🧺</span>Tirar roupas</button>
      <button class="tool" id="tPhoto"><span class="e">📸</span>Foto</button>
      <button class="tool" id="tChallenge"><span class="e">🏆</span>Desafio</button>
    </div>
  </section>
  <section class="col">
    <div class="card nm-wrap"><label class="nm-label" for="nameMenu">Quem está brincando?</label><input class="nm-input" id="nameMenu" maxlength="12" placeholder="Escreva seu nome" autocomplete="off"></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="card" id="panel"></div>
  </section>
</main>

<section class="rk-card" aria-label="Ranking"><div class="rk-title" id="rkTitle">🏆 Ranking · Estrelas dos desafios</div><div id="rkList"></div></section>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="mcard" id="mcard"></div></div>

<footer>Criado por Wesley de Jesus<span id="installWrap" hidden> · <button id="installBtn" type="button">📲 Instalar no aparelho</button></span></footer>

<script>
(function(){
  "use strict";
  /* ===== Jogador e ranking (fica salvo neste aparelho) ===== */
  var NAME_KEY = "joguinhos-jogador";
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function cleanName(n){ return String(n==null?"":n).replace(/\s+/g," ").trim().slice(0,12); }

  function makeRanking(cfg){
    var key = cfg.key, low = !!cfg.low;
    function storeKey(){ return "joguinhos-rank-"+key; }
    function readList(){
      try{ var a = JSON.parse(lsGet(storeKey())||"[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; }
    }
    function cmp(x,y){
      return low ? (x.s-y.s)||((x.t||0)-(y.t||0)) : (y.s-x.s)||((x.d||0)-(y.d||0));
    }
    function nameNow(){ return cleanName(lsGet(NAME_KEY)) || "Jogador"; }
    function rowsAll(){ return cfg.rows ? cfg.rows() : readList().sort(cmp); }
    function render(){
      var box = document.getElementById("rkList"); if(!box) return;
      var rows = rowsAll().slice(0,5), me = nameNow().toLowerCase();
      box.textContent = "";
      if(!rows.length){
        var e = document.createElement("div"); e.className = "rk-empty";
        e.textContent = "Ninguém no ranking ainda. Seja o primeiro!"; box.appendChild(e); return;
      }
      var medals = ["🥇","🥈","🥉"];
      rows.forEach(function(r,i){
        var d = document.createElement("div");
        d.className = "rk-row" + (String(r.n).toLowerCase()===me ? " me" : "");
        var a = document.createElement("span"); a.className = "rk-pos"; a.textContent = medals[i] || (i+1)+"º";
        var b = document.createElement("span"); b.className = "rk-name"; b.textContent = r.n;
        var c = document.createElement("span"); c.className = "rk-score"; c.textContent = cfg.fmt ? cfg.fmt(r) : r.s;
        d.appendChild(a); d.appendChild(b); d.appendChild(c); box.appendChild(d);
      });
    }
    // registra a pontuação (guarda só a melhor de cada jogador) e devolve a posição
    function submit(score, extra){
      if(!(score>0)) return null;
      var name = nameNow(), id = name.toLowerCase(), a = readList(), found = -1;
      for(var i=0;i<a.length;i++){ if(String(a[i].n).toLowerCase()===id){ found = i; break; } }
      var entry = {n:name, s:score, t:extra||0, d:Date.now()};
      if(found>=0){ if(cmp(entry,a[found])<0) a[found] = entry; } else { a.push(entry); }
      a.sort(cmp); a = a.slice(0,50);
      lsSet(storeKey(), JSON.stringify(a));
      var rows = rowsAll(), pos = 0;
      for(var j=0;j<rows.length;j++){ if(String(rows[j].n).toLowerCase()===id){ pos = j+1; break; } }
      render();
      return {name:name, pos:pos};
    }
    function line(res){
      if(!res || !res.pos) return "";
      return res.pos===1 ? "🥇 "+res.name+" está em 1º lugar no ranking!" : "🏅 "+res.name+" está em "+res.pos+"º lugar no ranking";
    }
    function init(){
      var inputs = document.querySelectorAll(".nm-input"), saved = cleanName(lsGet(NAME_KEY));
      Array.prototype.forEach.call(inputs,function(inp){
        inp.value = saved;
        inp.addEventListener("input",function(){
          lsSet(NAME_KEY, cleanName(inp.value));
          Array.prototype.forEach.call(inputs,function(o){ if(o!==inp) o.value = inp.value; });
          render();
        });
      });
      render();
    }
    return {init:init, render:render, submit:submit, line:line, name:nameNow,
            setKey:function(k){ key = k; render(); }};
  }

  var RK = makeRanking({key:"boneca-estrelas", fmt:function(r){ return r.s+" ⭐"; }});
  var $ = function(id){ return document.getElementById(id); };

  /* ---------- tema e som ---------- */
  var savedTheme = lsGet("boneca-theme");
  if(savedTheme==="light"||savedTheme==="dark") document.documentElement.setAttribute("data-theme",savedTheme);
  function syncTheme(){ var dark = document.documentElement.getAttribute("data-theme")!=="light"; $("iconSun").style.display = dark?"":"none"; $("iconMoon").style.display = dark?"none":""; }
  syncTheme();
  $("themeBtn").addEventListener("click",function(){
    var next = document.documentElement.getAttribute("data-theme")!=="light"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next); lsSet("boneca-theme",next); syncTheme();
  });
  var soundOn = lsGet("boneca-sound")!=="0", ac = null;
  function syncSound(){ $("soundIcon").textContent = soundOn?"🔊":"🔇"; }
  syncSound();
  function actx(){ if(!soundOn) return null; if(!ac){ var C = window.AudioContext||window.webkitAudioContext; if(C) ac = new C(); } if(ac && ac.state==="suspended") ac.resume(); return ac; }
  function tone(f,st,d,type,v,slide){
    var a = actx(); if(!a) return;
    var t = a.currentTime+st, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+0.03);
  }
  function sPop(){ var f = 520+Math.random()*380; tone(f,0,0.09,"sine",0.14,f*1.6); }
  function sSparkle(){ [1320,1760,2093].forEach(function(f,i){ tone(f,i*0.06,0.16,"triangle",0.07); }); }
  function sKiss(){ tone(1100,0,0.12,"sine",0.12,420); tone(700,0.5,0.1,"sine",0.12,1400); }
  function sCam(){
    var a = actx(); if(!a) return; var n = a.sampleRate*0.12, b = a.createBuffer(1,n,a.sampleRate), d = b.getChannelData(0);
    for(var i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n,3);
    var s = a.createBufferSource(), g = a.createGain(); g.gain.value = 0.35; s.buffer = b; s.connect(g); g.connect(a.destination); s.start();
    tone(1800,0.02,0.05,"square",0.05);
  }
  function sWin(){ [523,659,784,1047,1319].forEach(function(f,i){ tone(f,i*0.11,0.3,"triangle",0.16); }); tone(1047,0.65,0.6,"sine",0.12); }
  $("soundBtn").addEventListener("click",function(){ soundOn=!soundOn; lsSet("boneca-sound",soundOn?"1":"0"); syncSound(); if(soundOn) sPop(); });

  /* ---------- cores ---------- */
  function rgb(h){ var n = parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
  function shade(h,t){ var c = rgb(h); return "rgb("+c.map(function(v){ return Math.round(v*(1-t)); }).join(",")+")"; }
  function luma(h){ var c = rgb(h); return 0.299*c[0]+0.587*c[1]+0.114*c[2]; }
  var SKINS = ["#fde2cf","#f6c7a3","#e8b08a","#c98b5e","#a36a43","#6f4428"];
  var HAIRC = ["#6b3e1f","#a0693a","#2b1d14","#f2c45a","#fbe3a1","#c2541b","#f472b6","#a855f7","#60a5fa","#6ee7b7","#e5e7eb"];
  var EYES = ["#6b3e1f","#b7791f","#3b82f6","#22a35a","#222222","#8b5cf6","#ec4899"];
  var LIPS = ["#e8908a","#f9a8d4","#ec4899","#fb7185","#dc2626","#9f1239","#f97316","#a21caf","#c08070"];
  var SHADOWS = ["","#f9a8d4","#c084fc","#60a5fa","#2dd4bf","#fcd34d","#fb923c"];
  var BLUSH = ["","#f9a8b8","#fdba74","#f87171","#e879f9"];
  var CLOTH = ["#f472b6","#ec4899","#fda4af","#ef4444","#fb923c","#facc15","#a3e635","#4ade80","#2dd4bf","#60a5fa","#1d4ed8","#a78bfa","#7c3aed","#ffffff","#1f2937","#d6b48c"];
  var PRINTS = [{k:"liso",n:"Lisa"},{k:"bolinhas",n:"Bolinhas"},{k:"listras",n:"Listras"},{k:"xadrez",n:"Xadrez"},{k:"coracoes",n:"Corações"},{k:"estrelas",n:"Estrelas"},{k:"flores",n:"Flores"}];

        return thumb("40 14 220 300",hairBack(i,h,d)+'<rect x="140" y="166" width="20" height="40" rx="8" fill="'+sk+'"/><ellipse cx="150" cy="118" rx="56" ry="60" fill="'+sk+'"/><circle cx="128" cy="124" r="6" fill="#333"/><circle cx="172" cy="124" r="6" fill="#333"/><path d="M140 158 Q150 166 160 158" stroke="#c0505a" stroke-width="3" fill="none" stroke-linecap="round"/>'+hairFront(i,h,d));
      },true);
      addSwatches(box,"Cor do cabelo",HAIRC,S.hairColor,function(c){ S.hairColor = c; sPop(); renderDoll(); renderPanel(); });
    } else if(tab==="eyes"){
      addSwatches(box,"Cor dos olhos",EYES,S.eyes,function(c){ S.eyes = c; sPop(); renderDoll(); renderPanel(); });
    } else if(tab==="lips"){
      addSwatches(box,"Escolha o batom e veja passar na boca!",LIPS,S.lips,function(c){ applyLips(c); setTimeout(renderPanel,500); },"💄");
    } else if(tab==="makeup"){
      addSwatches(box,"Sombra nos olhos",SHADOWS,S.shadow,function(c){ S.shadow = c; sPop(); renderDoll(); renderPanel(); if(c) sparkle(150,110); });
      addSwatches(box,"Blush nas bochechas",BLUSH,S.blush,function(c){ S.blush = c; sPop(); renderDoll(); renderPanel(); if(c) sparkle(150,146); });
    } else if(tab==="top"||tab==="bottom"||tab==="dress"){
      var list = tab==="top"?TOPS:(tab==="bottom"?BOTTOMS:DRESSES), vb = tab==="top"?"72 186 156 140":(tab==="bottom"?"64 284 172 222":"34 190 232 330");
      addItems(box,list,function(i){ return tab==="dress" ? S.dress.i===i : (S.dress.i===0 && S[tab].i===i); },function(i){ pickGarment(tab,i); },function(it,i){
        if(tab==="dress" && i===0) return '<div class="em">🚫</div>'; return garmentThumb(list,tab,vb)(it); },tab==="dress");
      addSwatches(box,"Cor",CLOTH,S[tab].c,function(c){ S[tab].c = c; if(tab==="dress" && S.dress.i===0) S.dress.i = 1; else if(tab!=="dress") S.dress.i = 0; sPop(); renderDoll(); renderPanel(); });
      addPrints(box,S[tab]);
      if(tab==="dress") box.appendChild(el("div","hint","Dica: o vestido fica no lugar da blusa e da saia."));
    } else if(tab==="shoes"){
      addItems(box,SHOES,function(i){ return S.shoes.i===i; },function(i){ pickGarment("shoes",i); },function(it,i){
        if(i===0) return '<div class="em">🦶</div>'; return thumb("110 424 80 90",'<rect x="125" y="400" width="22" height="92" rx="10" fill="#f3dbe6"/><rect x="153" y="400" width="22" height="92" rx="10" fill="#f3dbe6"/>'+it.d(S.shoes.c,shade(S.shoes.c,0.3))); });
      addSwatches(box,"Cor",CLOTH,S.shoes.c,function(c){ S.shoes.c = c; if(S.shoes.i===0) S.shoes.i = 1; sPop(); renderDoll(); renderPanel(); });
    } else if(tab==="acc"){
      addItems(box,ACC,function(i){ return !!S.acc[ACC[i].k]; },function(i){
        var a = ACC[i];
        if(S.acc[a.k]) delete S.acc[a.k];
        else { if(a.g) ACC.forEach(function(o){ if(o.g===a.g) delete S.acc[o.k]; }); S.acc[a.k] = 1; sSparkle(); }
        renderDoll(); renderPanel(); sparkle(150,a.g==="head"?60:200);
      },function(it){ return '<div class="em">'+it.e+'</div>'; });
      box.appendChild(el("div","hint","Toque de novo para tirar. Dá para usar vários acessórios juntos!"));
    } else if(tab==="bg"){
      addItems(box,BGS,function(i){ return S.bg===i; },function(i){ S.bg = i; sPop(); renderDoll(); renderPanel(); },function(it){ return thumb("0 0 300 540",it.d()); },true);
    }
  }

  /* ---------- ferramentas ---------- */
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function rnd(n){ return Math.floor(Math.random()*n); }
  function randomLook(){
    S.hair = rnd(HAIRS.length); S.hairColor = pick(HAIRC); S.eyes = pick(EYES); S.lips = pick(LIPS); S.shadow = pick(SHADOWS); S.blush = pick(BLUSH);
    function pr(){ return Math.random()<0.55 ? "liso" : pick(PRINTS).k; }
    if(Math.random()<0.4){ S.dress = {i:1+rnd(DRESSES.length-1),c:pick(CLOTH),p:pr()}; }
    else { S.dress.i = 0; S.top = {i:rnd(TOPS.length),c:pick(CLOTH),p:pr()}; S.bottom = {i:rnd(BOTTOMS.length),c:pick(CLOTH),p:pr()}; }
    S.shoes = {i:1+rnd(SHOES.length-1),c:pick(CLOTH)};
    S.acc = {}; var n = rnd(4);
    for(var j=0;j<n;j++){ var a = pick(ACC); if(a.g) ACC.forEach(function(o){ if(o.g===a.g) delete S.acc[o.k]; }); S.acc[a.k] = 1; }
    S.bg = rnd(BGS.length);
  }
  $("tRandom").addEventListener("click",function(){ randomLook(); sSparkle(); renderDoll(); renderPanel(); sparkle(150,120); sparkle(150,380); });
  $("tClear").addEventListener("click",function(){
    S.top = {i:0,c:"#ffffff",p:"liso"}; S.bottom = {i:0,c:"#fda4af",p:"liso"}; S.dress.i = 0; S.shoes.i = 0; S.acc = {}; S.lips = LIPS[0]; S.shadow = ""; S.blush = BLUSH[1];
    sPop(); renderDoll(); renderPanel();
  });

  /* ---------- foto ---------- */
  var DL = null;
  try{ if(window.claude && window.claude.use) window.claude.use("downloads").then(function(d){ DL = d; }).catch(function(){}); }catch(e){}
  function dataToBlob(u){ var p = u.split(","), mime = p[0].split(":")[1].split(";")[0], b64 = p[0].indexOf("base64")>0, s = b64 ? atob(p[1]) : decodeURIComponent(p[1]), a = new Uint8Array(s.length);
    for(var i=0;i<s.length;i++) a[i] = s.charCodeAt(i)&255; return new Blob([a],{type:mime}); }
  function saveFile(name,url){
    if(DL){ DL.save({filename:name,data:dataToBlob(url)}).catch(function(){}); return; }
    var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  }
  function openModal(html){ $("mcard").innerHTML = html; $("modal").classList.add("on"); }
  function closeModal(){ $("modal").classList.remove("on"); }
  $("modal").addEventListener("click",function(e){ if(e.target===$("modal")) closeModal(); });
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  $("tPhoto").addEventListener("click",function(){
    sCam(); var flash = $("stage"); flash.style.filter = "brightness(1.8)"; setTimeout(function(){ flash.style.filter = ""; },140);
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 540" width="600" height="1080">'+dollSVG("p")+'</svg>';
    var src = "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg), img = new Image(), who = RK.name()!=="Jogador" ? RK.name() : "";
    img.onload = function(){
      var url = src;
      try{
        var c = document.createElement("canvas"); c.width = 600; c.height = 1170; var x = c.getContext("2d");
        x.fillStyle = "#fff"; x.fillRect(0,0,600,1170); x.drawImage(img,0,0,600,1080);
        x.fillStyle = "#db2777"; x.textAlign = "center"; x.font = "800 34px Nunito, sans-serif"; x.fillText(who ? "Look da "+who+" 💖" : "Meu look 💖",300,1124);
        x.fillStyle = "#9d5c86"; x.font = "700 18px Nunito, sans-serif"; x.fillText("Vista a Boneca · Criado por Wesley de Jesus",300,1156);
        url = c.toDataURL("image/png");
      }catch(e){}
      openModal('<div class="mt">📸 Que lindo!</div><img src="'+url+'" alt="Foto da boneca"><div class="ms">No celular, segure o dedo na foto para salvar.</div>'+
        '<div class="mbtns"><button class="btn" id="mSave">Baixar foto</button><button class="btn alt" id="mClose">Fechar</button></div>');
      $("mClose").addEventListener("click",closeModal);
      $("mSave").addEventListener("click",function(){ saveFile("boneca"+(who?"-"+who.replace(/[^\w-]/g,""):"")+(url.indexOf("image/png")>0?".png":".svg"),url); });
    };
    img.src = src;
  });

  /* ---------- desafio ---------- */
  var THEMES = [
    {k:"praia",n:"Dia de praia",e:"🏖️",d:"Vista a boneca para brincar na praia!"},
    {k:"festa",n:"Festa de aniversário",e:"🎉",d:"A boneca vai a uma festa. Capriche no brilho!"},
    {k:"inverno",n:"Dia de frio",e:"❄️",d:"Está muito frio! Agasalhe bem a boneca."},
    {k:"princesa",n:"Baile da princesa",e:"👑",d:"Transforme a boneca numa princesa!"},
    {k:"escola",n:"Dia de escola",e:"🎒",d:"Arrume a boneca para ir à escola."},
    {k:"esporte",n:"Hora do esporte",e:"⚽",d:"A boneca vai jogar bola e correr!"}
  ];
  var cur = null, lastTheme = -1;
  function has(t,k){ return t.indexOf(k)>=0; }
  function names(list,k,from){ return list.slice(from||0).filter(function(x){ return has(x.t,k); }).map(function(x){ return x.n; }).slice(0,3).join(", "); }
  function startChallenge(){
    var i; do{ i = rnd(THEMES.length); }while(i===lastTheme && THEMES.length>1); lastTheme = i; cur = THEMES[i];
    $("chText").innerHTML = "<b>"+cur.e+" Desafio: "+cur.n+"</b>"+cur.d; $("chBar").classList.add("on"); sSparkle(); window.scrollTo({top:0,behavior:"smooth"});
  }
  function judge(){
    var k = cur.k, ok = 0, tips = [];
    if(S.dress.i>0){ if(has(DRESSES[S.dress.i].t,k)) ok += 2; else tips.push("👗 Roupa: experimente "+(names(DRESSES,k,1)||names(TOPS,k))); }
    else {
      if(has(TOPS[S.top.i].t,k)) ok++; else tips.push("👚 Blusa: "+names(TOPS,k));
      if(has(BOTTOMS[S.bottom.i].t,k)) ok++; else tips.push("👖 Saia ou calça: "+names(BOTTOMS,k));
    }
    if(S.shoes.i>0 && has(SHOES[S.shoes.i].t,k)) ok++; else tips.push("👠 Sapatos: "+names(SHOES,k,1));
    if(ACC.some(function(a){ return S.acc[a.k] && has(a.t,k); })) ok++; else tips.push("🎀 Acessório: "+names(ACC,k));
    if(has(BGS[S.bg].t,k)) ok++; else tips.push("🏞️ Cenário: "+names(BGS,k));
    return {ok:ok,tips:tips};
  }
  function starsKey(){ return "joguinhos-boneca-stars-"+RK.name().toLowerCase(); }
  $("tChallenge").addEventListener("click",function(){ sPop(); startChallenge(); });
  $("chExit").addEventListener("click",function(){ cur = null; $("chBar").classList.remove("on"); sPop(); });
  $("chDone").addEventListener("click",function(){
    if(!cur) return; var r = judge(), stars = r.ok>=4?3:(r.ok===3?2:(r.ok>=1?1:0));
    var total = (parseInt(lsGet(starsKey())||"0",10)||0)+stars; if(stars) lsSet(starsKey(),String(total));
    var res = stars ? RK.submit(total) : null;
    var title = stars===3 ? "Arrasou! Look perfeito!" : (stars===2 ? "Muito bonito!" : (stars===1 ? "Quase lá!" : "Vamos tentar de novo?"));
    var html = '<div class="stars">'+"★".repeat(stars)+"☆".repeat(3-stars)+'</div><div class="mt">'+title+'</div><div class="ms">'+cur.e+" "+cur.n+": combinou "+r.ok+" de 5 coisas com o tema.</div>";
    if(r.tips.length) html += '<ul class="mlist">'+r.tips.map(function(t){ return "<li>"+esc(t)+"</li>"; }).join("")+'</ul>';
    html += '<div class="ms">'+(stars ? "⭐ +"+stars+" estrela"+(stars>1?"s":"")+" · Total de "+esc(RK.name())+": "+total : "Use as dicas e tente de novo!")+'</div>';
    if(res) html += '<div class="ms" style="color:var(--gold)">'+esc(RK.line(res))+'</div>';
    html += '<div class="mbtns"><button class="btn" id="mNext">Novo desafio</button><button class="btn alt" id="mKeep">'+(stars===3?"Continuar":"Tentar de novo")+'</button></div>';
    openModal(html); if(stars>=2) sWin(); else sPop();
    $("mNext").addEventListener("click",function(){ closeModal(); startChallenge(); });
    $("mKeep").addEventListener("click",function(){ closeModal(); if(stars===3){ cur = null; $("chBar").classList.remove("on"); } });
  });

  document.addEventListener("keydown",function(e){
    if(e.target && e.target.tagName==="INPUT" && e.key==="Enter"){ e.preventDefault(); e.target.blur(); }
    if(e.key==="Escape") closeModal();
  });
  RK.init(); renderTabs(); renderPanel(); renderDoll();
})();
</script>
<script>
(function(){
  var wrap=document.getElementById('installWrap'), btn=document.getElementById('installBtn');
  if(!wrap||!btn) return;
  var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone;
  if(standalone) return;
  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; wrap.hidden=false; });
  btn.addEventListener('click',function(){
    if(!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred=null; wrap.hidden=true; });
  });
  window.addEventListener('appinstalled',function(){ wrap.hidden=true; });
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
    btn.textContent='📲 No iPhone: toque em Compartilhar e depois em Adicionar à Tela de Início';
    btn.disabled=true; wrap.hidden=false;
  }
})();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
