<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jogo da Memória</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --rkw:520px;
  /* layout: coluna única — título, dificuldade, placar, grade de cartas, rodapé */
  --bg:#f1f3fb;
  --panel:#ffffff;
  --card-back:#dfe4f5;
  --line:#d8ddf0;
  --text:#1d2342;
  --muted:#5b6388;
  --accent:#7c3aed;
  --accent-soft:#ede9fe;
  --good:#16a34a;
  --shadow:0 10px 30px rgba(29,35,66,.12);
  --font-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,sans-serif;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#0f1026; --panel:#1a1c3f; --card-back:#23264f; --line:#2b2f63;
    --text:#edf0ff; --muted:#9aa3d0; --accent:#a78bfa; --accent-soft:#2a2355;
    --good:#4ade80; --shadow:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1026; --panel:#1a1c3f; --card-back:#23264f; --line:#2b2f63;
  --text:#edf0ff; --muted:#9aa3d0; --accent:#a78bfa; --accent-soft:#2a2355;
  --good:#4ade80; --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--font-body);
  display:flex;flex-direction:column;align-items:center;
  padding:16px;gap:12px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  transition:background .3s,color .3s;
}
header{width:min(94vw,520px);display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{
  font-family:var(--font-display);
  font-size:clamp(1.3rem,5vw,1.7rem);text-wrap:balance;
  background:linear-gradient(90deg,#a78bfa,#f472b6,#fbbf24,#4ade80);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.icon-btn{
  width:42px;height:42px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);
}
.icon-btn svg{width:20px;height:20px}
.hbtns{display:flex;gap:8px}
.icon-btn:focus-visible,.seg button:focus-visible,.big-btn:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{
  width:min(94vw,520px);display:flex;gap:8px;
}
.seg button{
  flex:1;padding:9px 0;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-family:var(--font-body);
  font-weight:800;font-size:.9rem;cursor:pointer;box-shadow:var(--shadow);
}
.seg button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.scores{width:min(94vw,520px);display:flex;gap:8px}
.chip{
  flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:7px 10px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.chip .label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.chip .value{font-family:var(--font-display);font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}
#pairs{color:var(--good)}
#record{color:var(--accent)}
.board-wrap{position:relative;width:min(94vw,520px)}
.board{
  display:grid;gap:8px;width:100%;
}
.card{
  aspect-ratio:3/4;border:none;background:transparent;cursor:pointer;
  perspective:600px;padding:0;
}
.card .inner{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;transition:transform .35s;
}
.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.face.back{
  background:linear-gradient(135deg,var(--card-back),var(--panel));
  font-family:var(--font-display);font-weight:800;font-size:1.3rem;color:var(--accent);
}
.face.front{
  background:var(--panel);transform:rotateY(180deg);
  font-size:clamp(1.5rem,7vw,2.3rem);
}
.card.matched .face.front{
  background:var(--accent-soft);border-color:var(--good);
  animation:pop .4s;
}
@keyframes pop{ 50%{transform:rotateY(180deg) scale(1.12)} }
.card.wrong .inner{animation:shake .35s}
@keyframes shake{
  25%{transform:translateX(-5px)} 50%{transform:translateX(5px)} 75%{transform:translateX(-3px)}
}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;text-align:center;
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  border-radius:16px;padding:20px;z-index:2;
}
.overlay.hidden{display:none}
.overlay .emoji{font-size:2.8rem;line-height:1}
.overlay .big{font-family:var(--font-display);font-size:clamp(1.4rem,6vw,1.9rem);font-weight:800}
.overlay .sub{color:var(--muted);font-weight:700}
#newRecord{
  display:none;background:var(--accent-soft);color:var(--accent);
  border:1px solid var(--accent);border-radius:999px;
  padding:4px 14px;font-weight:800;font-size:.85rem;
}
.big-btn{
  margin-top:6px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#a78bfa,#7c3aed);
  color:#fff;font-family:var(--font-display);font-weight:800;
  font-size:1.05rem;padding:12px 30px;border-radius:999px;
  box-shadow:0 8px 20px rgba(124,58,237,.4);transition:transform .12s;
}
.big-btn:active{transform:scale(.95)}
footer{margin-top:auto;padding-top:6px;color:var(--muted);font-size:.72rem;font-weight:600;letter-spacing:.03em}
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
/* nome do jogador e ranking */
.nm-wrap{display:flex;flex-direction:column;gap:4px;align-items:center}
.nm-label{font-size:.78rem;font-weight:800;color:var(--muted)}
.nm-input{width:min(230px,72vw);text-align:center;font:inherit;font-weight:800;font-size:1rem;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text)}
.nm-input:focus{outline:none;border-color:var(--accent)}
.nm-row{display:flex;gap:8px;align-items:center;justify-content:center;width:min(94vw,var(--rkw,440px))}
.nm-row .nm-input{flex:1;max-width:260px;text-align:left}
.nm-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.rk-card{width:min(94vw,var(--rkw,440px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.screen .rk-card{width:100%}
.rk-title{font-family:var(--font-display);font-weight:800;font-size:1.05rem}
.rk-row{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.92rem;padding:4px 8px;border-radius:10px}
.rk-row.me{background:var(--accent-soft)}
.rk-pos{width:2rem;text-align:center;flex:none}
.rk-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-score{color:var(--accent);font-variant-numeric:tabular-nums;flex:none}
.rk-empty{color:var(--muted);font-weight:700;font-size:.85rem}
.rk-line{font-weight:800;color:var(--accent);text-align:center;text-wrap:balance;min-height:1.2em}
#overOverlay .emoji,#winOverlay .emoji{font-size:2.1rem}
#overOverlay,#winOverlay{gap:7px}
.overlay{overflow-y:auto;justify-content:safe center}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1026">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jogo da Memória">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
#installWrap button{background:none;border:none;color:var(--accent);font:inherit;font-weight:800;
  cursor:pointer;text-decoration:underline;padding:0}
#installWrap button:disabled{cursor:default;text-decoration:none;color:var(--muted)}
</style>
</head>
<body>

<header>
  <h1>🧠 Jogo da Memória</h1>
  <div class="hbtns">
  <button class="icon-btn" id="soundBtn" aria-label="Ligar ou desligar o som" title="Som"><span id="soundIcon" style="font-size:1.1rem;line-height:1">🔊</span></button>
  <button class="icon-btn" id="themeBtn" aria-label="Trocar tema" title="Trocar tema">
    <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  </div>
</header>

<div class="seg" id="levelSeg">
  <button data-level="facil" class="active">Fácil</button>
  <button data-level="medio">Médio</button>
  <button data-level="dificil">Difícil</button>
</div>

<div class="nm-row"><label class="nm-label" for="nameMem">Jogador:</label><input class="nm-input" id="nameMem" maxlength="12" placeholder="Seu nome" autocomplete="off"></div>

<div class="scores">
  <div class="chip"><span class="label">Pares</span><span class="value" id="pairs">0/6</span></div>
  <div class="chip"><span class="label">Jogadas</span><span class="value" id="moves">0</span></div>
  <div class="chip"><span class="label">Tempo</span><span class="value" id="time">0:00</span></div>
  <div class="chip"><span class="label">Recorde</span><span class="value" id="record">—</span></div>
</div>

<div class="board-wrap">
  <div class="board" id="board"></div>
  <div class="overlay hidden" id="winOverlay">
    <div class="emoji">🎉</div>
    <div class="big">Você venceu!</div>
    <div class="sub" id="winInfo"></div>
    <span id="newRecord">🏆 Novo recorde!</span>
    <div class="rk-line" id="rankLine"></div>
    <button class="big-btn" id="againBtn">Jogar de novo</button>
  </div>
</div>

<section class="rk-card" aria-label="Ranking"><div class="rk-title" id="rkTitle">🏆 Ranking</div><div id="rkList"></div></section>

<footer>Criado por Wesley de Jesus<span id="installWrap" hidden> · <button id="installBtn" type="button">📲 Instalar no aparelho</button></span></footer>

<script>
(function(){
  "use strict";
  /* ===== Jogador e ranking (fica salvo neste aparelho) ===== */
  var NAME_KEY = "joguinhos-jogador";
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function cleanName(n){ return String(n==null?"":n).replace(/\s+/g," ").trim().slice(0,12); }

  function makeRanking(cfg){
    var key = cfg.key, low = !!cfg.low;
    function storeKey(){ return "joguinhos-rank-"+key; }
    function readList(){
      try{ var a = JSON.parse(lsGet(storeKey())||"[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; }
    }
    function cmp(x,y){
      return low ? (x.s-y.s)||((x.t||0)-(y.t||0)) : (y.s-x.s)||((x.d||0)-(y.d||0));
    }
    function nameNow(){ return cleanName(lsGet(NAME_KEY)) || "Jogador"; }
    function rowsAll(){ return cfg.rows ? cfg.rows() : readList().sort(cmp); }
    function render(){
      var box = document.getElementById("rkList"); if(!box) return;
      var rows = rowsAll().slice(0,5), me = nameNow().toLowerCase();
      box.textContent = "";
      if(!rows.length){
        var e = document.createElement("div"); e.className = "rk-empty";
        e.textContent = "Ninguém no ranking ainda. Seja o primeiro!"; box.appendChild(e); return;
      }
      var medals = ["🥇","🥈","🥉"];
      rows.forEach(function(r,i){
        var d = document.createElement("div");
        d.className = "rk-row" + (String(r.n).toLowerCase()===me ? " me" : "");
        var a = document.createElement("span"); a.className = "rk-pos"; a.textContent = medals[i] || (i+1)+"º";
        var b = document.createElement("span"); b.className = "rk-name"; b.textContent = r.n;
        var c = document.createElement("span"); c.className = "rk-score"; c.textContent = cfg.fmt ? cfg.fmt(r) : r.s;
        d.appendChild(a); d.appendChild(b); d.appendChild(c); box.appendChild(d);
      });
    }
    // registra a pontuação (guarda só a melhor de cada jogador) e devolve a posição
    function submit(score, extra){
      if(!(score>0)) return null;
      var name = nameNow(), id = name.toLowerCase(), a = readList(), found = -1;
      for(var i=0;i<a.length;i++){ if(String(a[i].n).toLowerCase()===id){ found = i; break; } }
      var entry = {n:name, s:score, t:extra||0, d:Date.now()};
      if(found>=0){ if(cmp(entry,a[found])<0) a[found] = entry; } else { a.push(entry); }
      a.sort(cmp); a = a.slice(0,50);
      lsSet(storeKey(), JSON.stringify(a));
      var rows = rowsAll(), pos = 0;
      for(var j=0;j<rows.length;j++){ if(String(rows[j].n).toLowerCase()===id){ pos = j+1; break; } }
      render();
      return {name:name, pos:pos};
    }
    function line(res){
      if(!res || !res.pos) return "";
      return res.pos===1 ? "🥇 "+res.name+" está em 1º lugar no ranking!" : "🏅 "+res.name+" está em "+res.pos+"º lugar no ranking";
    }
    function init(){
      var inputs = document.querySelectorAll(".nm-input"), saved = cleanName(lsGet(NAME_KEY));
      Array.prototype.forEach.call(inputs,function(inp){
        inp.value = saved;
        inp.addEventListener("input",function(){
          lsSet(NAME_KEY, cleanName(inp.value));
          Array.prototype.forEach.call(inputs,function(o){ if(o!==inp) o.value = inp.value; });
          render();
        });
      });
      render();
    }
    return {init:init, render:render, submit:submit, line:line, name:nameNow,
            setKey:function(k){ key = k; render(); }};
  }

  var RK = makeRanking({key:"memoria-facil", low:true, fmt:function(r){ return r.s+" jogadas · "+fmt(r.t); }});
  var EMOJIS = ["🐶","🐱","🦊","🐼","🐸","🦁","🐷","🐵","🦄","🐙","🦋","🐞","🍎","🍉","🍍","🍓","⚽","🚀","🌵","🌈","⭐","🎈","🍕","🎁"];

  var LEVELS = {
    facil:  {pairs:6,  cols:3},
    medio:  {pairs:8,  cols:4},
    dificil:{pairs:12, cols:4}
  };

  var board = document.getElementById("board");
  var pairsEl = document.getElementById("pairs");
  var movesEl = document.getElementById("moves");
  var timeEl = document.getElementById("time");
  var recordEl = document.getElementById("record");
  var winOv = document.getElementById("winOverlay");
  var winInfo = document.getElementById("winInfo");
  var newRecordEl = document.getElementById("newRecord");

  function store(key,val){ try{ if(val===undefined) return localStorage.getItem(key); localStorage.setItem(key,val); }catch(e){ return null; } }

  /* sons (gerados no próprio navegador, sem arquivos) */
  var soundOn = store("mem-sound")!=="off";
  var audioCtx = null;
  function ac(){
    if(!soundOn) return null;
    try{
      if(!audioCtx){ var C = window.AudioContext||window.webkitAudioContext; if(C) audioCtx = new C(); }
      if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
    }catch(e){}
    return audioCtx;
  }
  function tone(freq,start,dur,type,vol,slideTo){
    try{
      var ctx = audioCtx; if(!ctx) return;
      var o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime+start;
      o.type = type||"triangle";
      o.frequency.setValueAtTime(freq,t);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t+dur+0.05);
    }catch(e){}
  }
  function sFlip(){ if(ac()) { tone(520,0,.07,"triangle",.16); tone(780,.04,.07,"triangle",.1); } }
  function sMatch(){ if(ac()) { tone(659,0,.14,"triangle",.22); tone(880,.12,.14,"triangle",.22); tone(1175,.24,.22,"triangle",.24); } }
  function sWrong(){ if(ac()) { tone(260,0,.22,"sawtooth",.1,160); } }
  function sWin(){
    if(!ac()) return;
    var seq=[523.25,659.25,783.99,1046.5,783.99,1046.5];
    for(var i=0;i<seq.length;i++) tone(seq[i], i*.14, .18, "triangle", .24);
    tone(1318.5,.84,.55,"triangle",.26);
  }
  function syncSoundIcon(){ document.getElementById("soundIcon").textContent = soundOn ? "🔊" : "🔇"; }
  syncSoundIcon();
  document.getElementById("soundBtn").addEventListener("click",function(){
    soundOn = !soundOn;
    store("mem-sound", soundOn ? "on" : "off");
    syncSoundIcon();
    if(soundOn && ac()) tone(660,0,.12,"triangle",.2);
  });

  /* tema */
  var savedTheme = store("mem-theme");
  if(savedTheme==="light"||savedTheme==="dark"){ document.documentElement.setAttribute("data-theme",savedTheme); }
  function syncThemeIcon(){
    var dark = document.documentElement.getAttribute("data-theme")!=="light";
    document.getElementById("iconSun").style.display = dark?"":"none";
    document.getElementById("iconMoon").style.display = dark?"none":"";
  }
  syncThemeIcon();
  document.getElementById("themeBtn").addEventListener("click",function(){
    var cur = document.documentElement.getAttribute("data-theme")!=="light"?"dark":"light";
    var next = cur==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    store("mem-theme",next); syncThemeIcon();
  });

  var level="facil", deck=[], first=null, lock=false, found=0, moves=0;
  var timer=null, seconds=0, started=false;

  function fmt(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

  function loadRecord(){
    var r = store("mem-record-"+level);
    recordEl.textContent = r ? r+" jog." : "—";
  }

  function shuffle(a){
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=a[i];a[i]=a[j];a[j]=t;
    }
    return a;
  }

  function stopTimer(){ clearInterval(timer); timer=null; }

  function newGame(){
    stopTimer();
    seconds=0; moves=0; found=0; first=null; lock=false; started=false;
    timeEl.textContent="0:00"; movesEl.textContent="0";
    winOv.classList.add("hidden");
    var cfg = LEVELS[level];
    pairsEl.textContent = "0/"+cfg.pairs;
    loadRecord();
    RK.setKey("memoria-"+level);
    document.getElementById("rkTitle").textContent = "🏆 Ranking · "+({facil:"Fácil",medio:"Médio",dificil:"Difícil"})[level]+" (menos jogadas)";

    var pool = shuffle(EMOJIS.slice()).slice(0,cfg.pairs);
    deck = shuffle(pool.concat(pool));

    board.style.gridTemplateColumns = "repeat("+cfg.cols+",1fr)";
    board.innerHTML = "";
    for(var i=0;i<deck.length;i++){
      var btn = document.createElement("button");
      btn.className="card";
      btn.setAttribute("aria-label","Carta "+(i+1));
      btn.dataset.i=i;
      btn.innerHTML = '<div class="inner"><div class="face back">?</div><div class="face front">'+deck[i]+'</div></div>';
      btn.addEventListener("click",onFlip);
      board.appendChild(btn);
    }
  }

  function onFlip(e){
    var card = e.currentTarget;
    if(lock || card.classList.contains("flipped") || card.classList.contains("matched")) return;

    if(!started){
      started=true;
      timer=setInterval(function(){ seconds++; timeEl.textContent=fmt(seconds); },1000);
    }

    card.classList.add("flipped");
    sFlip();

    if(!first){ first=card; return; }

    moves++; movesEl.textContent=moves;
    var a=first, b=card; first=null;

    if(deck[a.dataset.i]===deck[b.dataset.i]){
      a.classList.add("matched"); b.classList.add("matched");
      found++;
      setTimeout(sMatch,180);
      pairsEl.textContent = found+"/"+LEVELS[level].pairs;
      if(found===LEVELS[level].pairs) win();
    } else {
      lock=true;
      setTimeout(function(){
        a.classList.add("wrong"); b.classList.add("wrong");
        sWrong();
        setTimeout(function(){
          a.classList.remove("flipped","wrong");
          b.classList.remove("flipped","wrong");
          lock=false;
        },350);
      },450);
    }
  }

  function win(){
    stopTimer();
    winInfo.textContent = "Você fez em "+moves+" jogadas e "+fmt(seconds);
    var prev = parseInt(store("mem-record-"+level)||"0",10);
    var isRecord = !prev || moves<prev;
    if(isRecord){
      store("mem-record-"+level,String(moves));
      loadRecord();
    }
    newRecordEl.style.display = isRecord?"inline-block":"none";
    document.getElementById("rankLine").textContent = RK.line(RK.submit(moves, seconds));
    setTimeout(sWin,650);
    setTimeout(function(){ winOv.classList.remove("hidden"); },500);
  }

  var segBtns = document.querySelectorAll("#levelSeg button");
  for(var s=0;s<segBtns.length;s++){
    segBtns[s].addEventListener("click",function(){
      for(var k=0;k<segBtns.length;k++) segBtns[k].classList.remove("active");
      this.classList.add("active");
      level = this.dataset.level;
      newGame();
    });
  }

  document.getElementById("againBtn").addEventListener("click",newGame);

  newGame();
  RK.init();
})();
</script>
<script>
(function(){
  var wrap=document.getElementById('installWrap'), btn=document.getElementById('installBtn');
  if(!wrap||!btn) return;
  var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone;
  if(standalone) return;
  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; wrap.hidden=false; });
  btn.addEventListener('click',function(){
    if(!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred=null; wrap.hidden=true; });
  });
  window.addEventListener('appinstalled',function(){ wrap.hidden=true; });
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
    btn.textContent='📲 No iPhone: toque em Compartilhar e depois em Adicionar à Tela de Início';
    btn.disabled=true; wrap.hidden=false;
  }
})();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
