<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dominó</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  /* layout: coluna única — título, placar, nível, mesa, mão do jogador, ranking, rodapé */
  --bg:#eef2fb; --panel:#ffffff; --line:#d8ddf0; --text:#1d2342; --muted:#5b6388;
  --accent:#d97706; --accent-soft:#fef3c7; --danger:#e11d48;
  --felt1:#2f8f6b; --felt2:#1d6a4e;
  --shadow:0 10px 30px rgba(29,35,66,.12);
  --font-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,sans-serif;
  --w:min(94vw,520px); --rkw:520px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#0f1420; --panel:#1a2236; --line:#2b3654; --text:#eef2ff; --muted:#9aa7cf;
    --accent:#fbbf24; --accent-soft:#3a2d0c; --danger:#fb7185;
    --felt1:#14543f; --felt2:#0b2f24;
    --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1420; --panel:#1a2236; --line:#2b3654; --text:#eef2ff; --muted:#9aa7cf;
  --accent:#fbbf24; --accent-soft:#3a2d0c; --danger:#fb7185;
  --felt1:#14543f; --felt2:#0b2f24;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--text);font-family:var(--font-body);
  display:flex;flex-direction:column;align-items:center;padding:14px;gap:10px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .3s,color .3s;
}
header{width:var(--w);display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{
  font-family:var(--font-display);font-size:clamp(1.3rem,5vw,1.7rem);
  background:linear-gradient(90deg,#fde68a,#fbbf24,#f472b6,#22d3ee);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
}
.hbtns{display:flex;gap:8px}
.icon-btn{
  width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);
  cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);font-size:1.15rem;
}
.icon-btn svg{width:20px;height:20px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.scores{width:var(--w);display:flex;gap:8px}
.chip{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;gap:1px}
.chip .label{font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chip .value{font-family:var(--font-display);font-size:1.1rem;font-weight:800;font-variant-numeric:tabular-nums}
#ptsMe{color:#34d399} #ptsCpu{color:#fb7185} #yardN{color:var(--accent)}
.seg{width:var(--w);display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{flex:1;border:none;background:none;color:var(--muted);font:inherit;font-weight:800;padding:7px 8px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--accent);color:#1b1405}
.seg.lock{opacity:.55;pointer-events:none}
.cpu{width:var(--w);display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 10px;box-shadow:var(--shadow);min-height:56px}
.cpu .who{font-weight:800;font-size:.8rem;color:var(--muted);flex:none;text-align:center;line-height:1.15}
.backs{flex:1;display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.backs .tile{width:17px;height:34px}
/* mesa */
.stage{
  position:relative;width:var(--w);height:clamp(300px,44vh,420px);border-radius:20px;overflow:hidden;
  border:8px solid #6b4423;box-shadow:var(--shadow),inset 0 0 28px rgba(0,0,0,.55);
  background:radial-gradient(ellipse at 50% 40%,var(--felt1),var(--felt2));
}
#board{
  --t:calc(var(--w) / 5.9);
  width:100%;height:100%;overflow-y:auto;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;
  align-items:center;gap:4px;padding:12px;
}
#board .tile.h{width:var(--t);height:calc(var(--t) / 2)}
#board .tile.v{width:calc(var(--t) / 2);height:var(--t)}
.empty-msg{color:rgba(255,255,255,.7);font-weight:800;text-align:center}
.tile{display:block;border:0;background:none;padding:0;flex:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.tile svg{width:100%;height:100%;display:block}
.tile.last{filter:drop-shadow(0 0 7px rgba(251,191,36,.95)) drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.pop{animation:pop .32s ease-out}
@keyframes pop{0%{transform:scale(1.5);opacity:.2}100%{transform:scale(1);opacity:1}}
.slot{
  --t:inherit;width:42px;height:42px;border:3px dashed #fbbf24;border-radius:12px;background:rgba(0,0,0,.28);color:#fde68a;
  font-family:var(--font-display);font-weight:800;font-size:1.05rem;cursor:pointer;animation:pulse 1s ease-in-out infinite;flex:none
}
@keyframes pulse{50%{transform:scale(1.12);background:rgba(251,191,36,.25)}}
.msg{width:var(--w);text-align:center;font-weight:800;min-height:2.6em;display:flex;align-items:center;justify-content:center;text-wrap:balance}
#hand{width:var(--w);--hw:min(62px,calc((var(--w) - 48px) / 7));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:calc(var(--hw) * 2 + 14px);padding-top:10px}
#hand .tile{width:var(--hw);height:calc(var(--hw) * 2);cursor:pointer;transition:transform .15s,opacity .2s}
#hand .tile.ok{transform:translateY(-8px);filter:drop-shadow(0 0 8px rgba(251,191,36,.95)) drop-shadow(0 3px 3px rgba(0,0,0,.4))}
#hand .tile.dim{opacity:.45}
#hand .tile.sel{transform:translateY(-14px) scale(1.07);filter:drop-shadow(0 0 10px rgba(56,189,248,.95)) drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.actions{width:var(--w);display:flex;justify-content:center}
.act{
  border:none;cursor:pointer;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1b1405;font-family:var(--font-display);
  font-weight:800;font-size:1.02rem;padding:11px 26px;border-radius:999px;box-shadow:0 8px 20px rgba(245,158,11,.35);transition:transform .12s
}
.act:active{transform:scale(.95)}
.act:disabled{opacity:.4;box-shadow:none;cursor:default}
.act.pulse{animation:pulse 1s ease-in-out infinite}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:8px;text-align:center;
  background:rgba(8,20,16,.84);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);padding:16px;z-index:2;color:#f4f7f5;overflow-y:auto
}
.overlay.hidden{display:none}
.overlay .emoji{font-size:2.2rem;line-height:1}
.overlay .big{font-family:var(--font-display);font-size:clamp(1.4rem,6vw,1.9rem);font-weight:800}
.overlay .sub{color:#c6d3cd;font-weight:700;text-wrap:balance;font-size:.92rem}
.overlay .nm-label{color:#c6d3cd}
.overlay .rk-line{color:#fde68a}
#hero{display:flex;gap:6px;justify-content:center}
#hero .tile{width:42px;height:84px}
#hero .tile:nth-child(1){transform:rotate(-10deg)} #hero .tile:nth-child(2){transform:translateY(-6px)} #hero .tile:nth-child(3){transform:rotate(10deg)}
.rev{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:100%}
.rev .tile{width:22px;height:44px}
.rev-t{font-size:.72rem;font-weight:800;color:#c6d3cd}
.big-btn{
  margin-top:4px;border:none;cursor:pointer;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1b1405;font-family:var(--font-display);
  font-weight:800;font-size:1.05rem;padding:11px 30px;border-radius:999px;box-shadow:0 8px 20px rgba(245,158,11,.4);transition:transform .12s
}
.big-btn:active{transform:scale(.95)}
footer{margin-top:auto;padding-top:6px;color:var(--muted);font-size:.72rem;font-weight:600;letter-spacing:.03em}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* nome do jogador e ranking */
.nm-wrap{display:flex;flex-direction:column;gap:4px;align-items:center}
.nm-label{font-size:.78rem;font-weight:800;color:var(--muted)}
.nm-input{width:min(230px,72vw);text-align:center;font:inherit;font-weight:800;font-size:1rem;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text)}
.nm-input:focus{outline:none;border-color:var(--accent)}
.nm-row{display:flex;gap:8px;align-items:center;justify-content:center;width:min(94vw,var(--rkw,440px))}
.nm-row .nm-input{flex:1;max-width:260px;text-align:left}
.nm-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.rk-card{width:min(94vw,var(--rkw,440px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.screen .rk-card{width:100%}
.rk-title{font-family:var(--font-display);font-weight:800;font-size:1.05rem}
.rk-row{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.92rem;padding:4px 8px;border-radius:10px}
.rk-row.me{background:var(--accent-soft)}
.rk-pos{width:2rem;text-align:center;flex:none}
.rk-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-score{color:var(--accent);font-variant-numeric:tabular-nums;flex:none}
.rk-empty{color:var(--muted);font-weight:700;font-size:.85rem}
.rk-line{font-weight:800;color:var(--accent);text-align:center;text-wrap:balance;min-height:1.2em}
#overOverlay .emoji,#winOverlay .emoji{font-size:2.1rem}
#overOverlay,#winOverlay{gap:7px}
.overlay{overflow-y:auto;justify-content:safe center}

</style>

#installWrap button{background:none;border:none;color:var(--accent);font:inherit;font-weight:800;
  cursor:pointer;text-decoration:underline;padding:0}
#installWrap button:disabled{cursor:default;text-decoration:none;color:var(--muted)}
</style>

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffef9"/><stop offset=".55" stop-color="#f7f0da"/><stop offset="1" stop-color="#e5d9b8"/></linearGradient>
  <linearGradient id="boneback" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9dfc2"/><stop offset="1" stop-color="#cdbf98"/></linearGradient>
  <radialGradient id="pip" cx=".38" cy=".33" r=".75"><stop offset="0" stop-color="#555"/><stop offset=".55" stop-color="#101010"/><stop offset="1" stop-color="#000"/></radialGradient>
  <radialGradient id="brass" cx=".38" cy=".33" r=".8"><stop offset="0" stop-color="#fff2b8"/><stop offset=".5" stop-color="#d9ac3c"/><stop offset="1" stop-color="#85601a"/></radialGradient>
</defs></svg>

<header>
  <h1>🁫 Dominó</h1>
  <div class="hbtns">
    <button class="icon-btn" id="soundBtn" aria-label="Som ligado/desligado" title="Som"><span id="soundIcon">🔊</span></button>
    <button class="icon-btn" id="themeBtn" aria-label="Trocar tema" title="Trocar tema">
      <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div class="scores">
  <div class="chip"><span class="label">Você</span><span class="value" id="ptsMe">0</span></div>
  <div class="chip"><span class="label">Computador</span><span class="value" id="ptsCpu">0</span></div>
  <div class="chip"><span class="label">Monte</span><span class="value" id="yardN">14</span></div>
  <div class="chip"><span class="label">Rodada</span><span class="value" id="roundN">1</span></div>
</div>

<div class="seg" id="levelSeg" role="group" aria-label="Nível">
  <button data-level="facil">1 · Fácil</button>
  <button data-level="medio">2 · Médio</button>
  <button data-level="dificil">3 · Difícil</button>
</div>

<div class="cpu"><div class="who">💻<br>Computador</div><div class="backs" id="cpuBacks"></div></div>

<div class="stage" id="stage">
  <div id="board"></div>

  <div class="overlay" id="startOverlay">
    <div id="hero"></div>
    <div class="big">Dominó</div>
    <div class="sub">Encaixe as peças com o mesmo número. Quem fizer 30 pontos primeiro ganha!</div>
    <div class="nm-wrap"><label class="nm-label" for="nameStart">Quem vai jogar?</label><input class="nm-input" id="nameStart" maxlength="12" placeholder="Seu nome" autocomplete="off"></div>
    <div class="sub" id="winsLine"></div>
    <button class="big-btn" id="startBtn">Jogar</button>
  </div>

  <div class="overlay hidden" id="roundOverlay">
    <div class="emoji" id="rEmoji">🎉</div>
    <div class="big" id="rTitle"></div>
    <div class="sub" id="rSub"></div>
    <div class="rev-t">Peças que sobraram do computador</div><div class="rev" id="revCpu"></div>
    <div class="rev-t">Suas peças que sobraram</div><div class="rev" id="revMe"></div>
    <button class="big-btn" id="roundBtn">Próxima rodada</button>
  </div>

  <div class="overlay hidden" id="overOverlay">
    <div class="emoji" id="oEmoji">🏆</div>
    <div class="big" id="oTitle"></div>
    <div class="sub" id="oSub"></div>
    <div class="rk-line" id="rankLine"></div>
    <div class="nm-wrap"><label class="nm-label" for="nameOver">Próximo jogador:</label><input class="nm-input" id="nameOver" maxlength="12" placeholder="Seu nome" autocomplete="off"></div>
    <button class="big-btn" id="againBtn">Jogar de novo</button>
  </div>
</div>

<div class="msg" id="msg" aria-live="polite"></div>
<div id="hand"></div>
<div class="actions"><button class="act" id="buyBtn" type="button">🛒 Comprar do monte</button></div>

<section class="rk-card" aria-label="Ranking"><div class="rk-title" id="rkTitle">🏆 Ranking</div><div id="rkList"></div></section>

<footer>Criado por Wesley de Jesus<span id="installWrap" hidden> · <button id="installBtn" type="button">📲 Instalar no aparelho</button></span></footer>

<script>
(function(){
  "use strict";
  /* ===== Jogador e ranking (fica salvo neste aparelho) ===== */
  var NAME_KEY = "joguinhos-jogador";
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function cleanName(n){ return String(n==null?"":n).replace(/\s+/g," ").trim().slice(0,12); }

  function makeRanking(cfg){
    var key = cfg.key, low = !!cfg.low;
    function storeKey(){ return "joguinhos-rank-"+key; }
    function readList(){
      try{ var a = JSON.parse(lsGet(storeKey())||"[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; }
    }
    function cmp(x,y){
      return low ? (x.s-y.s)||((x.t||0)-(y.t||0)) : (y.s-x.s)||((x.d||0)-(y.d||0));
    }
    function nameNow(){ return cleanName(lsGet(NAME_KEY)) || "Jogador"; }
    function rowsAll(){ return cfg.rows ? cfg.rows() : readList().sort(cmp); }
    function render(){
      var box = document.getElementById("rkList"); if(!box) return;
      var rows = rowsAll().slice(0,5), me = nameNow().toLowerCase();
      box.textContent = "";
      if(!rows.length){
        var e = document.createElement("div"); e.className = "rk-empty";
        e.textContent = "Ninguém no ranking ainda. Seja o primeiro!"; box.appendChild(e); return;
      }
      var medals = ["🥇","🥈","🥉"];
      rows.forEach(function(r,i){
        var d = document.createElement("div");
        d.className = "rk-row" + (String(r.n).toLowerCase()===me ? " me" : "");
        var a = document.createElement("span"); a.className = "rk-pos"; a.textContent = medals[i] || (i+1)+"º";
        var b = document.createElement("span"); b.className = "rk-name"; b.textContent = r.n;
        var c = document.createElement("span"); c.className = "rk-score"; c.textContent = cfg.fmt ? cfg.fmt(r) : r.s;
        d.appendChild(a); d.appendChild(b); d.appendChild(c); box.appendChild(d);
      });
    }
    // registra a pontuação (guarda só a melhor de cada jogador) e devolve a posição
    function submit(score, extra){
      if(!(score>0)) return null;
      var name = nameNow(), id = name.toLowerCase(), a = readList(), found = -1;
      for(var i=0;i<a.length;i++){ if(String(a[i].n).toLowerCase()===id){ found = i; break; } }
      var entry = {n:name, s:score, t:extra||0, d:Date.now()};
      if(found>=0){ if(cmp(entry,a[found])<0) a[found] = entry; } else { a.push(entry); }
      a.sort(cmp); a = a.slice(0,50);
      lsSet(storeKey(), JSON.stringify(a));
      var rows = rowsAll(), pos = 0;
      for(var j=0;j<rows.length;j++){ if(String(rows[j].n).toLowerCase()===id){ pos = j+1; break; } }
      render();
      return {name:name, pos:pos};
    }
    function line(res){
      if(!res || !res.pos) return "";
      return res.pos===1 ? "🥇 "+res.name+" está em 1º lugar no ranking!" : "🏅 "+res.name+" está em "+res.pos+"º lugar no ranking";
    }
    function init(){
      var inputs = document.querySelectorAll(".nm-input"), saved = cleanName(lsGet(NAME_KEY));
      Array.prototype.forEach.call(inputs,function(inp){
        inp.value = saved;
        inp.addEventListener("input",function(){
          lsSet(NAME_KEY, cleanName(inp.value));
          Array.prototype.forEach.call(inputs,function(o){ if(o!==inp) o.value = inp.value; });
          render();
        });
      });
      render();
    }
    return {init:init, render:render, submit:submit, line:line, name:nameNow,
            setKey:function(k){ key = k; render(); }};
  }

  var RK = makeRanking({key:"domino-facil", fmt:function(r){ return r.s+(r.s===1?" vitória":" vitórias"); }});

  var META = 30;
  var LEVELS = {
    facil:  {nome:"Fácil",   delay:1100},
    medio:  {nome:"Médio",   delay:900},
    dificil:{nome:"Difícil", delay:800}
  };
  var $ = function(id){ return document.getElementById(id); };
  var level = lsGet("dom-level"); if(!LEVELS[level]) level = "facil";

  /* ---------- tema ---------- */
  var savedTheme = lsGet("dom-theme");
  if(savedTheme==="light"||savedTheme==="dark") document.documentElement.setAttribute("data-theme",savedTheme);
  function syncTheme(){
    var dark = document.documentElement.getAttribute("data-theme")!=="light";
    $("iconSun").style.display = dark?"":"none"; $("iconMoon").style.display = dark?"none":"";
  }
  syncTheme();
  $("themeBtn").addEventListener("click",function(){
    var next = document.documentElement.getAttribute("data-theme")!=="light"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next); lsSet("dom-theme",next); syncTheme();
  });

  /* ---------- sons ---------- */
  var soundOn = lsGet("dom-sound")!=="0", ac = null;
  function syncSound(){ $("soundIcon").textContent = soundOn?"🔊":"🔇"; }
  syncSound();
  function actx(){
    if(!ac){ var C = window.AudioContext||window.webkitAudioContext; if(C) ac = new C(); }
    if(ac && ac.state==="suspended") ac.resume();
    return ac;
  }
  function tone(f,st,d,type,v,slide){
    if(!soundOn) return; var c = actx(); if(!c) return;
    var t = c.currentTime+st, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+d+0.03);
  }
  function noise(d,v,f,q){
    if(!soundOn) return; var c = actx(); if(!c) return;
    var len = Math.floor(c.sampleRate*d), buf = c.createBuffer(1,len,c.sampleRate), data = buf.getChannelData(0);
    for(var i=0;i<len;i++) data[i] = (Math.random()*2-1)*Math.pow(1-i/len,2);
    var src = c.createBufferSource(); src.buffer = buf;
    var bp = c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=f; bp.Q.value=q||1;
    var g = c.createGain(); g.gain.value = v;
    src.connect(bp); bp.connect(g); g.connect(c.destination); src.start();
  }
  function sPlace(cpu){ noise(0.07,1.1,cpu?1500:2200,1.3); tone(cpu?140:185,0,0.1,"sine",0.4,65); }
  function sBuy(){ noise(0.24,0.55,900,0.8); tone(330,0.02,0.08,"triangle",0.08,260); }
  function sPass(){ tone(260,0,0.2,"triangle",0.16,170); }
  function sBad(){ tone(160,0,0.2,"square",0.09,100); }
  function sWinRound(){ [523,659,784].forEach(function(f,i){ tone(f,i*0.11,0.22,"triangle",0.17); }); }
  function sLoseRound(){ [392,330,262].forEach(function(f,i){ tone(f,i*0.14,0.26,"triangle",0.15); }); }
  function sWinMatch(){ [523,659,784,1047,1319].forEach(function(f,i){ tone(f,i*0.12,0.3,"triangle",0.18); }); tone(1047,0.7,0.6,"sine",0.14); }
  $("soundBtn").addEventListener("click",function(){ soundOn=!soundOn; lsSet("dom-sound",soundOn?"1":"0"); syncSound(); if(soundOn) sPlace(false); });

  /* ---------- desenho das peças (osso, bolinhas pretas) ---------- */
  var PIPS = (function(){
    var a=25,b=50,c=75;
    return {0:[],1:[[b,b]],2:[[a,a],[c,c]],3:[[a,a],[b,b],[c,c]],4:[[a,a],[c,a],[a,c],[c,c]],
            5:[[a,a],[c,a],[b,b],[a,c],[c,c]],6:[[a,a],[c,a],[a,b],[c,b],[a,c],[c,c]]};
  })();
  function tileSVG(a,b,horiz){
    var back = a<0, W = horiz?200:100, H = horiz?100:200;
    var s = '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
    s += '<rect x="2" y="2" width="'+(W-4)+'" height="'+(H-4)+'" rx="15" fill="url(#'+(back?"boneback":"bone")+')" stroke="#a89a73" stroke-width="2.5"/>';
    s += '<rect x="6.5" y="6.5" width="'+(W-13)+'" height="'+(H-13)+'" rx="11" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2"/>';
    s += '<rect x="9" y="9" width="'+(W-18)+'" height="'+(H-18)+'" rx="9" fill="none" stroke="#bfae82" stroke-opacity=".35" stroke-width="1.5"/>';
    var cx = W/2, cy = H/2;
    if(horiz){
      s += '<line x1="'+cx+'" y1="15" x2="'+cx+'" y2="'+(H-15)+'" stroke="#5e5034" stroke-width="3.2" stroke-linecap="round"/>';
      s += '<line x1="'+(cx+2.6)+'" y1="16" x2="'+(cx+2.6)+'" y2="'+(H-16)+'" stroke="#fff" stroke-opacity=".85" stroke-width="1.6" stroke-linecap="round"/>';
    } else {
      s += '<line x1="15" y1="'+cy+'" x2="'+(W-15)+'" y2="'+cy+'" stroke="#5e5034" stroke-width="3.2" stroke-linecap="round"/>';
      s += '<line x1="16" y1="'+(cy+2.6)+'" x2="'+(W-16)+'" y2="'+(cy+2.6)+'" stroke="#fff" stroke-opacity=".85" stroke-width="1.6" stroke-linecap="round"/>';
    }
    if(!back){
      [a,b].forEach(function(v,k){
        PIPS[v].forEach(function(p){
          var x = horiz ? p[1]+k*100 : p[0];
          var y = horiz ? p[0] : p[1]+k*100;
          s += '<circle cx="'+x+'" cy="'+(y+1)+'" r="11.6" fill="#a89a73" fill-opacity=".45"/>';
          s += '<circle cx="'+x+'" cy="'+y+'" r="10" fill="url(#pip)"/>';
          s += '<circle cx="'+(x-3.2)+'" cy="'+(y-3.4)+'" r="2.6" fill="#fff" fill-opacity=".38"/>';
        });
      });
    }
    s += '<circle cx="'+cx+'" cy="'+cy+'" r="7.2" fill="url(#brass)" stroke="#6d4f15" stroke-width="1.4"/>';
    s += '<circle cx="'+(cx-2)+'" cy="'+(cy-2.2)+'" r="1.8" fill="#fff" fill-opacity=".7"/>';
    return s + '</svg>';
  }
  function tileEl(a,b,horiz,btn){
    var el = document.createElement(btn?"button":"div");
    el.className = "tile "+(horiz?"h":"v");
    if(btn) el.type = "button";
    el.innerHTML = tileSVG(a,b,horiz);
    return el;
  }

  /* ---------- estado do jogo ---------- */
  var hand=[], cpu=[], yard=[], chain=[], turn="me", busy=true, round=0, ptsMe=0, ptsCpu=0;
  var inMatch=false, pending=null, lacks={}, lastTile=null, timers=[], roundEnd=null;

  function later(fn,ms){ timers.push(setTimeout(fn,ms)); }
  function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
  function mkSet(){ var s=[]; for(var a=0;a<=6;a++) for(var b=a;b<=6;b++) s.push({a:a,b:b}); return s; }
  function shuffle(arr){ for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }
  function pipsOf(list){ return list.reduce(function(n,t){ return n+t.a+t.b; },0); }
  function ends(){ return chain.length ? [chain[0].a, chain[chain.length-1].b] : null; }
  function fits(t){ if(!chain.length) return true; var e=ends(); return t.a===e[0]||t.b===e[0]||t.a===e[1]||t.b===e[1]; }
  function sidesOf(t){
    var e = ends(), r = [];
    if(t.a===e[1]||t.b===e[1]) r.push("R");
    if(e[0]!==e[1] && (t.a===e[0]||t.b===e[0])) r.push("L");
    return r;
  }
  function place(t,side){
    var o;
    if(!chain.length){ o={a:t.a,b:t.b}; chain.push(o); }
    else if(side==="R"){ var r=chain[chain.length-1].b; o = t.a===r?{a:t.a,b:t.b}:{a:t.b,b:t.a}; chain.push(o); }
    else { var l=chain[0].a; o = t.b===l?{a:t.a,b:t.b}:{a:t.b,b:t.a}; chain.unshift(o); }
    lastTile = o; return o;
  }
  function isBlocked(){ return yard.length===0 && !hand.some(fits) && !cpu.some(fits); }
  function setMsg(t){ $("msg").textContent = t; }

  /* ---------- desenho da tela ---------- */
  function renderBoard(){
    var board = $("board"); board.textContent = "";
    if(!chain.length){
      var e = document.createElement("div"); e.className="empty-msg"; e.textContent = inMatch?"Distribuindo as peças…":"A mesa está vazia"; board.appendChild(e); return;
    }
    function slot(side){
      var e2 = ends(), b = document.createElement("button"); b.type="button"; b.className="slot";
      b.textContent = side==="L" ? "◀ "+e2[0] : e2[1]+" ▶";
      b.setAttribute("aria-label","Colocar no lado "+(side==="L"?"esquerdo":"direito")+" (número "+(side==="L"?e2[0]:e2[1])+")");
      b.addEventListener("click",function(){ onSlot(side); }); return b;
    }
    if(pending && pending.sides.indexOf("L")>=0) board.appendChild(slot("L"));
    var lastEl = null;
    chain.forEach(function(t){
      var el = tileEl(t.a,t.b,t.a!==t.b,false);
      if(t===lastTile){ el.classList.add("last"); lastEl = el; }
      board.appendChild(el);
    });
    if(pending && pending.sides.indexOf("R")>=0) board.appendChild(slot("R"));
    if(lastEl && !pending && lastEl.dataset){ lastEl.classList.add("pop"); try{ lastEl.scrollIntoView({block:"nearest"}); }catch(e){} }
  }
  function renderHand(){
    var box = $("hand"); box.textContent = "";
    var active = inMatch && turn==="me" && !busy;
    hand.forEach(function(t){
      var el = tileEl(t.a,t.b,false,true);
      el.setAttribute("aria-label","Peça "+t.a+" e "+t.b);
      if(active && level==="facil") el.classList.add(fits(t)?"ok":"dim");
      if(pending && pending.tile===t) el.classList.add("sel");
      el.addEventListener("click",function(){ onTile(t,el); });
      box.appendChild(el);
    });
  }
  function renderCpu(){
    var box = $("cpuBacks"); box.textContent = "";
    cpu.forEach(function(){ box.appendChild(tileEl(-1,-1,false,false)); });
  }
  function renderHud(){
    $("ptsMe").textContent = ptsMe; $("ptsCpu").textContent = ptsCpu;
    $("yardN").textContent = yard.length; $("roundN").textContent = Math.max(round,1);
    var canBuy = inMatch && turn==="me" && !busy && yard.length>0 && !hand.some(fits);
    var b = $("buyBtn"); b.disabled = !canBuy; b.classList.toggle("pulse",canBuy);
    b.textContent = "🛒 Comprar do monte"+(yard.length?" ("+yard.length+")":"");
    $("levelSeg").classList.toggle("lock",inMatch);
    Array.prototype.forEach.call($("levelSeg").children,function(x){ x.classList.toggle("on",x.dataset.level===level); });
  }
  function renderAll(){ renderBoard(); renderHand(); renderCpu(); renderHud(); }

  /* ---------- vitórias e ranking ---------- */
  function winsKey(){ return "joguinhos-domino-wins-"+level+"-"+RK.name().toLowerCase(); }
  function getWins(){ return parseInt(lsGet(winsKey())||"0",10)||0; }
  function updWins(){
    var n = getWins(), who = RK.name();
    $("winsLine").textContent = n ? who+" já ganhou "+n+(n===1?" partida":" partidas")+" no nível "+LEVELS[level].nome+"." : "Nível "+LEVELS[level].nome+": vença partidas para subir no ranking!";
  }
  function setLevel(l){
    level = l; lsSet("dom-level",l); RK.setKey("domino-"+l);
    $("rkTitle").textContent = "🏆 Ranking · "+LEVELS[l].nome+" (vitórias)";
    updWins(); renderHud();
  }
  Array.prototype.forEach.call($("levelSeg").children,function(b){ b.addEventListener("click",function(){ if(!inMatch) setLevel(b.dataset.level); }); });
  Array.prototype.forEach.call(document.querySelectorAll(".nm-input"),function(i){ i.addEventListener("input",updWins); });

  /* ---------- fluxo da partida ---------- */
  function hideAll(){ ["startOverlay","roundOverlay","overOverlay"].forEach(function(id){ $(id).classList.add("hidden"); }); }
  function startMatch(){
    clearTimers(); hideAll(); ptsMe=0; ptsCpu=0; round=0; inMatch=true; startRound();
  }
  function bestDouble(list){ var m=-1; list.forEach(function(t){ if(t.a===t.b && t.a>m) m=t.a; }); return m; }
  function startRound(){
    var dm, dc;
    do { var all = shuffle(mkSet()); hand=all.slice(0,7); cpu=all.slice(7,14); yard=all.slice(14); dm=bestDouble(hand); dc=bestDouble(cpu); } while(dm<0 && dc<0);
    chain=[]; pending=null; lacks={}; lastTile=null; round++; busy=true; roundEnd=null;
    var meFirst = dm>dc, d = Math.max(dm,dc);
    setMsg("Rodada "+round+": começa quem tem o maior duplo…");
    renderAll();
    later(function(){
      var list = meFirst?hand:cpu, t = list.filter(function(x){ return x.a===d&&x.b===d; })[0];
      list.splice(list.indexOf(t),1); place(t,"R"); sPlace(!meFirst);
      setMsg((meFirst?"Você começa":"O computador começa")+" com o duplo "+d+"!");
      turn = meFirst?"cpu":"me"; renderAll();
      later(next,900);
    },900);
  }
  function next(){
    renderAll();
    if(hand.length===0) return endRound("me");
    if(cpu.length===0)  return endRound("cpu");
    if(isBlocked())     return endRound("block");
    if(turn==="me") myTurn(); else cpuTurn();
  }
  function noteLacks(){ var e=ends(); if(e){ lacks[e[0]]=true; lacks[e[1]]=true; } }
  function myTurn(){
    busy = false; pending = null;
    if(hand.some(fits)) setMsg("Sua vez! Toque numa peça que encaixa.");
    else if(yard.length) setMsg("Nenhuma peça encaixa. Toque em “Comprar do monte”!");
    else {
      busy = true; noteLacks(); setMsg("Sem jogada e o monte acabou. Você passa a vez.");
      later(function(){ sPass(); turn="cpu"; next(); },1500);
    }
    renderAll();
  }
  function onTile(t,el){
    if(!inMatch||turn!=="me"||busy) return;
    if(pending && pending.tile===t){ pending=null; setMsg("Sua vez! Toque numa peça que encaixa."); renderAll(); return; }
    if(!fits(t)){
      sBad(); setMsg("Essa peça não encaixa. Veja os números das pontas da mesa!");
      el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); return;
    }
    var s = sidesOf(t);
    if(s.length===1) playMe(t,s[0]);
    else { var e=ends(); pending={tile:t,sides:s}; setMsg("Escolha o lado: ◀ "+e[0]+"  ou  "+e[1]+" ▶"); renderAll(); }
  }
  function onSlot(side){ if(pending) playMe(pending.tile,side); }
  function playMe(t,side){
    busy = true; pending = null; hand.splice(hand.indexOf(t),1); place(t,side); sPlace(false);
    setMsg("Boa jogada! 👍"); renderAll();
    later(function(){ turn="cpu"; next(); },450);
  }
  $("board").addEventListener("click",function(e){ if(pending && e.target===$("board")){ pending=null; setMsg("Sua vez! Toque numa peça que encaixa."); renderAll(); } });
  $("buyBtn").addEventListener("click",function(){
    if(!inMatch||turn!=="me"||busy||!yard.length||hand.some(fits)) return;
    noteLacks(); hand.push(yard.pop()); sBuy(); renderAll(); myTurn();
  });

  /* ---------- computador ---------- */
  function candidates(list){
    var c = [];
    list.forEach(function(t){ sidesOf(t).forEach(function(s){ c.push({tile:t,side:s}); }); });
    return c;
  }
  function scoreMove(c){
    var t=c.tile, e=ends(), nl=e[0], nr=e[1];
    if(c.side==="R") nr = (t.a===e[1])?t.b:t.a; else nl = (t.b===e[0])?t.a:t.b;
    var s = t.a+t.b+(t.a===t.b?3:0), cnt = {};
    cpu.forEach(function(x){ if(x!==t){ cnt[x.a]=(cnt[x.a]||0)+1; if(x.b!==x.a) cnt[x.b]=(cnt[x.b]||0)+1; } });
    [nl,nr].forEach(function(v){ s += 1.5*(cnt[v]||0); if(lacks[v]) s += 5; if(!cnt[v]) s -= 2; });
    if(nl===nr) s += 1;
    return s + Math.random()*0.5;
  }
  function chooseMove(){
    var c = candidates(cpu);
    if(level==="facil") return c[Math.floor(Math.random()*c.length)];
    if(level==="medio"){
      var best=null, bs=-1; c.forEach(function(m){ var v=m.tile.a+m.tile.b+(m.tile.a===m.tile.b?4:0)+Math.random()*2; if(v>bs){ bs=v; best=m; } });
      return best;
    }
    var b2=null, s2=-1e9; c.forEach(function(m){ var v=scoreMove(m); if(v>s2){ s2=v; b2=m; } });
    return b2;
  }
  function cpuTurn(){
    busy = true; setMsg("O computador está pensando…"); renderHud();
    later(function step(){
      if(!cpu.some(fits)){
        if(yard.length){ cpu.push(yard.pop()); sBuy(); setMsg("O computador comprou uma peça do monte."); renderAll(); later(step,700); return; }
        setMsg("O computador passou a vez."); sPass(); later(function(){ turn="me"; next(); },1000); return;
      }
      var mv = chooseMove();
      cpu.splice(cpu.indexOf(mv.tile),1); place(mv.tile,mv.side); sPlace(true);
      setMsg("O computador jogou a peça "+mv.tile.a+" | "+mv.tile.b+"."); renderAll();
      later(function(){ turn="me"; next(); },650);
    },LEVELS[level].delay);
  }

  /* ---------- fim de rodada e de partida ---------- */
  function revealInto(id,list){
    var box = $(id); box.textContent = "";
    if(!list.length){ var z=document.createElement("span"); z.className="rev-t"; z.textContent="nenhuma 🎉"; box.appendChild(z); return; }
    list.forEach(function(t){ box.appendChild(tileEl(t.a,t.b,false,false)); });
  }
  function endRound(kind){
    busy = true; var pts = 0, title, sub, emoji, win = null;
    if(kind==="me"){ pts = pipsOf(cpu); ptsMe += pts; win=true; emoji="🎉"; title="Você bateu!"; sub="Você ganhou a rodada e fez +"+pts+" pontos."; }
    else if(kind==="cpu"){ pts = pipsOf(hand); ptsCpu += pts; win=false; emoji="😅"; title="O computador bateu!"; sub="Ele ganhou a rodada e fez +"+pts+" pontos."; }
    else {
      var sm = pipsOf(hand), sc = pipsOf(cpu);
      if(sm<sc){ pts=sc-sm; ptsMe+=pts; win=true; emoji="🎉"; title="Jogo fechado — você venceu!"; sub="Você ficou com menos pontos nas peças e fez +"+pts+"."; }
      else if(sc<sm){ pts=sm-sc; ptsCpu+=pts; win=false; emoji="😅"; title="Jogo fechado — ele venceu"; sub="O computador ficou com menos pontos e fez +"+pts+"."; }
      else { emoji="🤝"; title="Jogo fechado — empate!"; sub="Ninguém marca pontos nesta rodada."; }
    }
    if(win===true) sWinRound(); else if(win===false) sLoseRound(); else sPass();
    renderAll(); setMsg(title);
    var over = ptsMe>=META || ptsCpu>=META;
    $("rEmoji").textContent = emoji; $("rTitle").textContent = title;
    $("rSub").textContent = sub+"  Placar: você "+ptsMe+" × "+ptsCpu+" computador.";
    revealInto("revCpu",cpu); revealInto("revMe",hand);
    $("roundBtn").textContent = over ? "Ver resultado" : "Próxima rodada";
    roundEnd = {over:over};
    later(function(){ $("roundOverlay").classList.remove("hidden"); },kind==="block"?500:900);
  }
  $("roundBtn").addEventListener("click",function(){
    if(!roundEnd) return; $("roundOverlay").classList.add("hidden");
    if(roundEnd.over) showOver(); else startRound();
  });
  function showOver(){
    inMatch = false; var iWin = ptsMe>ptsCpu; renderHud();
    $("rankLine").textContent = "";
    if(iWin){
      var n = getWins()+1; lsSet(winsKey(),String(n));
      $("oEmoji").textContent="🏆"; $("oTitle").textContent="Você ganhou a partida!";
      $("oSub").textContent = "Placar final: você "+ptsMe+" × "+ptsCpu+" computador. Vitórias no nível "+LEVELS[level].nome+": "+n+".";
      $("rankLine").textContent = RK.line(RK.submit(n)); sWinMatch();
    } else {
      $("oEmoji").textContent="💪"; $("oTitle").textContent="O computador ganhou";
      $("oSub").textContent = "Placar final: você "+ptsMe+" × "+ptsCpu+" computador. Tente de novo, você consegue!"; sLoseRound();
    }
    setMsg(iWin?"Parabéns! 🎉":"Quase! Jogue de novo.");
    $("overOverlay").classList.remove("hidden");
  }
  $("startBtn").addEventListener("click",startMatch);
  $("againBtn").addEventListener("click",startMatch);
  document.addEventListener("keydown",function(e){
    if(e.target && e.target.tagName==="INPUT"){
      if(e.key==="Enter"){ e.preventDefault(); e.target.blur();
        if(!$("startOverlay").classList.contains("hidden")) startMatch();
        else if(!$("overOverlay").classList.contains("hidden")) startMatch(); }
      return;
    }
  });

  /* ---------- início ---------- */
  var hero = $("hero");
  [[6,6],[3,5],[2,4]].forEach(function(p){ hero.appendChild(tileEl(p[0],p[1],false,false)); });
  hand = []; cpu = []; yard = mkSet().slice(14);
  RK.init();
  setLevel(level);
  renderAll();
  setMsg("Escolha o nível, escreva seu nome e toque em Jogar.");
})();
</script>
<script>
(function(){
  var wrap=document.getElementById('installWrap'), btn=document.getElementById('installBtn');
  if(!wrap||!btn) return;
  var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone;
  if(standalone) return;
  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; wrap.hidden=false; });
  btn.addEventListener('click',function(){
    if(!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred=null; wrap.hidden=true; });
  });
  window.addEventListener('appinstalled',function(){ wrap.hidden=true; });
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
    btn.textContent='📲 No iPhone: toque em Compartilhar e depois em Adicionar à Tela de Início';
    btn.disabled=true; wrap.hidden=false;
  }
})();
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
